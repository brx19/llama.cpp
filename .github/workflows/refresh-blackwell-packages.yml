name: Refresh upstream and build Blackwell packages

on:
  workflow_dispatch:
  push:
    branches: [ci/cpasync-diagnostic]
    paths: [.github/workflows/refresh-blackwell-packages.yml]

permissions:
  contents: read

concurrency:
  group: blackwell-upstream-refresh
  cancel-in-progress: false

env:
  CUDA_VERSION: "13.3"
  CUDA_PKG: x64

jobs:
  prepare:
    name: Merge pinned upstream and publish source revisions
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      matrix: ${{ steps.refresh.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: refresh
        shell: python
        run: |
          import json, os, subprocess
          from pathlib import Path
          
          def git(*args, check=True):
              return subprocess.run(["git", *args], text=True, capture_output=True, check=check)
          
          def run(*args):
              r = git(*args, check=False)
              print(r.stdout, end="")
              print(r.stderr, end="")
              r.check_returncode()
              return r.stdout.strip()
          
          upstream = "41abbfd599fbdd3470fcae0a1fb6530ad8403cd7"
          branches = ["master", "blackwell/cpasync", "blackwell/tma", "blackwell/cutlass"]
          run("config", "user.name", "github-actions[bot]")
          run("config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com")
          run("fetch", "origin", *["refs/heads/" + b + ":refs/remotes/origin/" + b for b in branches])
          run("fetch", "https://github.com/ggml-org/llama.cpp.git", upstream)
          matrix = []
          refs = []
          for i, branch in enumerate(branches):
              old = run("rev-parse", "refs/remotes/origin/" + branch)
              local = "refresh-" + str(i)
              run("switch", "-c", local, old)
              r = git("merge", "--no-commit", "--no-ff", upstream, check=False)
              print(r.stdout, r.stderr)
              conflicts = run("diff", "--name-only", "--diff-filter=U").splitlines()
              if any(not p.startswith(".github/workflows/") for p in conflicts):
                  raise RuntimeError("Source conflicts require review: " + repr(conflicts))
              if r.returncode and not conflicts:
                  raise RuntimeError("Merge failed without resolvable workflow conflicts")
              if conflicts:
                  run("rm", "-f", "--", *conflicts)
              # Keep each branch's existing workflow policy exactly.
              run("rm", "-r", "-f", "--", ".github/workflows")
              run("restore", "--source=" + old, "--staged", "--worktree", "--", ".github/workflows")
              if git("rev-parse", "-q", "--verify", "MERGE_HEAD", check=False).returncode == 0:
                  run("commit", "-m", "Merge upstream " + upstream[:10] + " into " + branch)
              run("merge-base", "--is-ancestor", upstream, "HEAD")
              run("diff", "--check", upstream, "HEAD")
              source = upstream if i == 0 else run("rev-parse", "HEAD")
              variant = ["stock", "cpasync", "tma", "cutlass"][i]
              matrix.append({"variant": variant, "source_sha": source, "short_sha": source[:10],
                             "cmake_extra": "-DGGML_CUDA_CUTLASS=ON" if variant == "cutlass" else ""})
              refs.append(local + ":refs/heads/" + branch)
          # No force: publish all four branches together, or none.
          run("push", "--atomic", "origin", *refs)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("matrix=" + json.dumps({"include": matrix}) + "\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("Upstream: " + upstream + "\n\n")
              for item in matrix:
                  f.write("- " + item["variant"] + ": " + item["source_sha"] + "\n")
          # Make the running build discoverable through the repository contents API.
          run("switch", "-C", "refresh-status", os.environ["GITHUB_SHA"])
          path = Path(".github/blackwell-refresh-status.json")
          path.write_text(json.dumps({"upstream": upstream, "run_id": os.environ["GITHUB_RUN_ID"],
              "run_url": os.environ["GITHUB_SERVER_URL"] + "/" + os.environ["GITHUB_REPOSITORY"] + "/actions/runs/" + os.environ["GITHUB_RUN_ID"],
              "variants": matrix}, indent=2) + "\n")
          run("add", str(path))
          run("commit", "-m", "ci: record Blackwell refresh build provenance")
          run("push", "origin", "HEAD:refs/heads/ci/cpasync-diagnostic")

  build-cpu:
    needs: [prepare]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      SOURCE_SHA: ${{ matrix.source_sha }}
      SHORT_SHA: ${{ matrix.short_sha }}
    name: ${{ matrix.variant }} CPU toolset
    runs-on: windows-2022
    steps:
      - name: Checkout exact ${{ matrix.variant }} source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1

      - name: Verify source SHA
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:SOURCE_SHA) { throw "Expected $env:SOURCE_SHA, got $actual" }
          Write-Host "CPU source=$actual"

      - name: Install Ninja
        shell: pwsh
        run: choco install ninja -y

      - name: Build full Release toolset (CUDA OFF)
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          if errorlevel 1 exit /b 1
          where cl
          if errorlevel 1 exit /b 1
          if exist build-cpu rmdir /s /q build-cpu
          cmake -S . -B build-cpu -G "Ninja Multi-Config" ^
            -DLLAMA_BUILD_SERVER=ON ^
            -DLLAMA_BUILD_TOOLS=ON ^
            -DLLAMA_BUILD_TESTS=OFF ^
            -DLLAMA_BUILD_BORINGSSL=ON ^
            -DGGML_NATIVE=OFF ^
            -DGGML_BACKEND_DL=ON ^
            -DGGML_CPU_ALL_VARIANTS=ON ^
            -DGGML_OPENMP=ON ^
            -DGGML_RPC=ON ^
            -DGGML_CUDA=OFF
          if errorlevel 1 exit /b 1
          set /A NINJA_JOBS=%NUMBER_OF_PROCESSORS%-1
          cmake --build build-cpu --config Release -j %NINJA_JOBS%
          if errorlevel 1 exit /b 1
          if not exist build-cpu\bin\Release\llama-bench.exe exit /b 1
          if not exist build-cpu\bin\Release\llama-server.exe exit /b 1
          if not exist build-cpu\bin\Release\llama-server-impl.dll exit /b 1
          if not exist build-cpu\bin\Release\ggml-base.dll exit /b 1

      - name: Write CPU provenance
        shell: pwsh
        run: |
          @(
            'variant=${{ matrix.variant }}',
            "source_sha=$env:SOURCE_SHA",
            'component=cpu-toolset',
            'configuration=Release',
            'cuda=off',
            'ggml_backend_dl=on'
          ) | Set-Content 'build-cpu/bin/Release/BUILD-VARIANT-CPU.txt' -Encoding utf8

      - name: Upload CPU toolset
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.variant }}-cpu-${{ env.SHORT_SHA }}
          path: build-cpu/bin/Release/*
          retention-days: 14

  build-cuda:
    needs: [prepare]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      SOURCE_SHA: ${{ matrix.source_sha }}
      SHORT_SHA: ${{ matrix.short_sha }}
    name: ${{ matrix.variant }} ggml-cuda sm120a
    runs-on: windows-2022
    steps:
      - name: Checkout exact ${{ matrix.variant }} source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1

      - name: Verify source SHA
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:SOURCE_SHA) { throw "Expected $env:SOURCE_SHA, got $actual" }
          Write-Host "CUDA source=$actual"

      - name: Install CUDA Toolkit 13.3
        uses: ./.github/actions/windows-setup-cuda
        with:
          cuda_version: ${{ env.CUDA_VERSION }}
          cuda_arch: ${{ env.CUDA_PKG }}

      - name: Install Ninja
        shell: pwsh
        run: choco install ninja -y

      - name: Build Release ggml-cuda.dll (120a-real)
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          if errorlevel 1 exit /b 1
          where cl
          if errorlevel 1 exit /b 1
          where nvcc
          if errorlevel 1 exit /b 1
          if exist build-cuda rmdir /s /q build-cuda
          cmake -S . -B build-cuda -G "Ninja Multi-Config" ^
            -DGGML_BACKEND_DL=ON ^
            -DGGML_NATIVE=OFF ^
            -DGGML_CPU=OFF ^
            -DGGML_CUDA=ON ^
            -DLLAMA_BUILD_BORINGSSL=ON ^
            -DCMAKE_CUDA_ARCHITECTURES=120a-real ${{ matrix.cmake_extra }}
          if errorlevel 1 exit /b 1
          set /A NINJA_JOBS=%NUMBER_OF_PROCESSORS%-1
          cmake --build build-cuda --config Release -j %NINJA_JOBS% --target ggml-cuda
          if errorlevel 1 exit /b 1
          if not exist build-cuda\bin\Release\ggml-cuda.dll exit /b 1

      - name: Write CUDA provenance and hash
        shell: pwsh
        run: |
          @(
            'variant=${{ matrix.variant }}',
            "source_sha=$env:SOURCE_SHA",
            'component=ggml-cuda',
            'cuda=13.3',
            'cmake_cuda_architectures=120a-real',
            'configuration=Release'
          ) | Set-Content 'build-cuda/bin/Release/BUILD-VARIANT-CUDA.txt' -Encoding utf8
          Get-FileHash 'build-cuda/bin/Release/ggml-cuda.dll' -Algorithm SHA256 | Format-List

      - name: Upload CUDA backend
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.variant }}-cuda-${{ env.SHORT_SHA }}
          path: |
            build-cuda/bin/Release/ggml-cuda.dll
            build-cuda/bin/Release/BUILD-VARIANT-CUDA.txt
          retention-days: 14

  cuda-runtime:
    needs: [prepare]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      SOURCE_SHA: ${{ matrix.source_sha }}
      SHORT_SHA: ${{ matrix.short_sha }}
    name: CUDA 13.3 runtime
    runs-on: windows-2022
    steps:
      - name: Checkout exact source for local CUDA setup action
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1

      - name: Install CUDA Toolkit 13.3
        uses: ./.github/actions/windows-setup-cuda
        with:
          cuda_version: ${{ env.CUDA_VERSION }}
          cuda_arch: ${{ env.CUDA_PKG }}

      - name: Stage CUDA runtime DLLs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path cuda-runtime | Out-Null
          $patterns = @('cudart64_*.dll','cublas64_*.dll','cublasLt64_*.dll')
          $matches = @(
            foreach ($pattern in $patterns) {
              Get-ChildItem -Path $env:CUDA_PATH -Recurse -File -Filter $pattern -ErrorAction SilentlyContinue
            }
          )
          if ($matches.Count -eq 0) {
            throw "No CUDA runtime DLLs found recursively under $env:CUDA_PATH"
          }
          Write-Host "CUDA runtime candidates:"
          $matches | Sort-Object FullName | ForEach-Object { Write-Host "  $($_.FullName)" }
          foreach ($group in ($matches | Group-Object Name)) {
            $hashes = @(
              $group.Group |
                ForEach-Object { (Get-FileHash $_.FullName -Algorithm SHA256).Hash } |
                Sort-Object -Unique
            )
            if ($hashes.Count -ne 1) {
              throw "Conflicting copies found for $($group.Name): $($hashes -join ', ')"
            }
            $source = $group.Group | Sort-Object FullName | Select-Object -First 1
            Copy-Item $source.FullName -Destination cuda-runtime -Force
          }
          Get-ChildItem cuda-runtime -File | Sort-Object Name | Format-Table Name,Length
          foreach ($required in $patterns) {
            if (-not (Get-ChildItem cuda-runtime -Filter $required -File -ErrorAction SilentlyContinue)) {
              throw "Missing CUDA runtime component: $required"
            }
          }

      - name: Upload CUDA runtime
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.variant }}-cudart-13.3-x64
          path: cuda-runtime/*
          retention-days: 14

  merge-package:
    needs: [prepare, build-cpu, build-cuda, cuda-runtime]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      SOURCE_SHA: ${{ matrix.source_sha }}
      SHORT_SHA: ${{ matrix.short_sha }}
    name: merge coherent ${{ matrix.variant }} package
    runs-on: windows-2022
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    steps:
      - name: Download CPU toolset
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.variant }}-cpu-${{ env.SHORT_SHA }}
          path: package

      - name: Download CUDA backend
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.variant }}-cuda-${{ env.SHORT_SHA }}
          path: package

      - name: Download CUDA runtime
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.variant }}-cudart-13.3-x64
          path: package

      - name: Validate coherent package
        shell: pwsh
        run: |
          $required = @(
            'llama-bench.exe',
            'llama-server.exe',
            'llama-server-impl.dll',
            'llama.dll',
            'llama-common.dll',
            'ggml.dll',
            'ggml-base.dll',
            'ggml-cuda.dll',
            'BUILD-VARIANT-CPU.txt',
            'BUILD-VARIANT-CUDA.txt'
          )
          foreach ($f in $required) {
            if (-not (Test-Path "package/$f")) { throw "Missing required package file: $f" }
          }
          if (-not (Get-ChildItem package -Filter 'ggml-cpu*.dll' -File)) { throw 'No ggml-cpu backend DLLs found' }
          foreach ($pattern in @('cudart64_*.dll','cublas64_*.dll','cublasLt64_*.dll')) {
            if (-not (Get-ChildItem package -Filter $pattern -File)) { throw "Missing runtime: $pattern" }
          }
          $cpuProv = Get-Content package/BUILD-VARIANT-CPU.txt -Raw
          $cudaProv = Get-Content package/BUILD-VARIANT-CUDA.txt -Raw
          if ($cpuProv -notmatch [regex]::Escape($env:SOURCE_SHA)) { throw 'CPU provenance SHA mismatch' }
          if ($cudaProv -notmatch [regex]::Escape($env:SOURCE_SHA)) { throw 'CUDA provenance SHA mismatch' }
          Get-FileHash package/ggml-cuda.dll -Algorithm SHA256 | Format-List
          Get-ChildItem package | Sort-Object Name | Format-Table Name,Length

      - name: Create final ZIP
        shell: pwsh
        run: |
          $zip = "llama-win-cuda13.3-sm120a-${{ matrix.variant }}-$env:SHORT_SHA.zip"
          Push-Location package
          7z a -snl "../$zip" .\*
          if ($LASTEXITCODE -ne 0) { throw 'Final 7z packaging failed' }
          Pop-Location
          Get-FileHash $zip -Algorithm SHA256 | Format-List
          Get-Item $zip | Format-List Name,Length

      - name: Upload coherent ${{ matrix.variant }} package
        uses: actions/upload-artifact@v4
        with:
          name: llama-win-cuda13.3-sm120a-${{ matrix.variant }}-${{ env.SHORT_SHA }}
          path: llama-win-cuda13.3-sm120a-${{ matrix.variant }}-${{ env.SHORT_SHA }}.zip
          retention-days: 14
