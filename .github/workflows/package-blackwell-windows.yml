name: Package Blackwell TMA (existing artifacts)
run-name: Package TMA from run ${{ inputs.source_run_id || '34794445056' }}

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/package-blackwell-windows.yml'
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Actions run ID containing the successful CPU/TMA/CUDA artifacts"
        required: true
        type: string
        default: "34794445056"
      source_tma_sha:
        description: "Exact blackwell/tma commit SHA used by that source run"
        required: true
        type: string
        default: "00cef0cb0b82dc018b65843b534637588b8a8179"
      publish_release:
        description: "Publish the repackaged TMA ZIP to a GitHub Release"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

env:
  CUDA_VERSION: "13.3"
  SOURCE_RUN_ID: ${{ inputs.source_run_id || '34794445056' }}
  SOURCE_TMA_SHA: ${{ inputs.source_tma_sha || '00cef0cb0b82dc018b65843b534637588b8a8179' }}

jobs:
  package-existing-artifacts:
    runs-on: windows-2022
    name: merge existing TMA artifacts
    outputs:
      zip_name: ${{ steps.meta.outputs.zip_name }}
    steps:
      - name: Checkout packaging scripts from master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1

      - name: Preflight source run and artifacts
        id: preflight
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:SOURCE_RUN_ID -notmatch '^\d+$') {
            throw "source_run_id must be numeric, got: $env:SOURCE_RUN_ID"
          }
          if ($env:SOURCE_TMA_SHA -notmatch '^[0-9a-fA-F]{40}$') {
            throw "source_tma_sha must be a full 40-character git SHA, got: $env:SOURCE_TMA_SHA"
          }

          $runJson = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:SOURCE_RUN_ID"
          if ($LASTEXITCODE -ne 0) { throw "failed to query source run $env:SOURCE_RUN_ID" }
          $run = $runJson | ConvertFrom-Json
          Write-Host "source run: id=$($run.id) status=$($run.status) conclusion=$($run.conclusion) workflow=$($run.name) head_sha=$($run.head_sha)"
          if ($run.status -ne 'completed') {
            throw "source run $env:SOURCE_RUN_ID is not completed (status=$($run.status))"
          }

          $artJson = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:SOURCE_RUN_ID/artifacts?per_page=100"
          if ($LASTEXITCODE -ne 0) { throw "failed to query artifacts for source run $env:SOURCE_RUN_ID" }
          $arts = ($artJson | ConvertFrom-Json).artifacts
          $required = @(
            'llama-bin-win-cpu-x64.zip',
            'llama-bin-win-cuda-13.3-x64-tma.zip',
            'cudart-llama-bin-win-cuda-13.3-x64.zip'
          )
          foreach ($name in $required) {
            $a = $arts | Where-Object { $_.name -eq $name } | Select-Object -First 1
            if (-not $a) { throw "required artifact '$name' is missing from source run $env:SOURCE_RUN_ID" }
            if ($a.expired) { throw "required artifact '$name' is expired" }
            Write-Host "artifact OK: $name id=$($a.id) size=$($a.size_in_bytes) expires=$($a.expires_at)"
          }

          "source_head_sha=$($run.head_sha)" >> $env:GITHUB_OUTPUT
          "source_workflow=$($run.name)" >> $env:GITHUB_OUTPUT

      - name: Download CPU toolset artifact
        uses: actions/download-artifact@v4
        with:
          name: llama-bin-win-cpu-x64.zip
          path: dist/cpu
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Download TMA CUDA backend artifact
        uses: actions/download-artifact@v4
        with:
          name: llama-bin-win-cuda-13.3-x64-tma.zip
          path: dist/tma
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Download CUDA runtime artifact
        uses: actions/download-artifact@v4
        with:
          name: cudart-llama-bin-win-cuda-13.3-x64.zip
          path: dist/cudart
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Merge into one self-contained package
        id: merge
        shell: pwsh
        run: |
          $cpuZip = Get-ChildItem -Path 'dist/cpu' -Recurse -Filter 'llama-bin-win-cpu-x64.zip' | Select-Object -First 1
          $cudaZip = Get-ChildItem -Path 'dist/tma' -Recurse -Filter 'llama-bin-win-cuda-13.3-x64-tma.zip' | Select-Object -First 1
          $cudartZip = Get-ChildItem -Path 'dist/cudart' -Recurse -Filter 'cudart-llama-bin-win-cuda-13.3-x64.zip' | Select-Object -First 1
          if (-not $cpuZip) { throw "CPU toolset ZIP not found after artifact download" }
          if (-not $cudaZip) { throw "TMA CUDA backend ZIP not found after artifact download" }
          if (-not $cudartZip) { throw "CUDA runtime ZIP not found after artifact download" }

          Write-Host "Downloaded package inputs:"
          Write-Host "  CPU:    $($cpuZip.FullName)"
          Write-Host "  TMA:    $($cudaZip.FullName)"
          Write-Host "  CUDART: $($cudartZip.FullName)"

          Start-Sleep -Seconds 5
          $src = Join-Path $env:RUNNER_TEMP 'tma-package-src'
          if (Test-Path $src) { Remove-Item $src -Recurse -Force }
          New-Item -ItemType Directory -Path $src -Force | Out-Null

          $copies = @(
            @($cpuZip.FullName, 'cpu.zip'),
            @($cudaZip.FullName, 'cuda.zip'),
            @($cudartZip.FullName, 'cudart.zip')
          )
          foreach ($c in $copies) {
            $from = $c[0]
            $to = Join-Path $src $c[1]
            $ok = $false
            for ($i = 0; $i -lt 5 -and -not $ok; $i++) {
              try {
                Copy-Item $from $to -Force
                $ok = $true
              } catch {
                Write-Host "Copy attempt $($i + 1) failed: $($_.Exception.Message); retrying in 3s..."
                Start-Sleep -Seconds 3
              }
            }
            if (-not $ok) { throw "failed to copy $from after 5 attempts" }
          }

          $stage = Join-Path $env:RUNNER_TEMP 'tma-package-stage'
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Path $stage -Force | Out-Null

          python .github/scripts/extract_tma_packages.py $src $stage
          if ($LASTEXITCODE -ne 0) { throw "extract_tma_packages.py failed with exit code $LASTEXITCODE" }

          $files = @(Get-ChildItem $stage -File | ForEach-Object { $_.Name })
          Write-Host "Merged staging contents ($($files.Count) files):"
          $files | Sort-Object | ForEach-Object { Write-Host "  $_" }

          $missing = @()
          foreach ($req in @(
            'llama-server.exe',
            'llama-server-impl.dll',
            'llama-bench.exe',
            'llama.dll',
            'llama-common.dll',
            'ggml.dll',
            'ggml-base.dll',
            'ggml-cuda.dll'
          )) {
            if (-not (Test-Path (Join-Path $stage $req))) { $missing += $req }
          }
          if (@($files | Where-Object { $_ -like 'ggml-cpu-*.dll' }).Count -eq 0) { $missing += 'ggml-cpu-*.dll' }
          foreach ($pat in @('cudart64_*.dll','cublas64_*.dll','cublasLt64_*.dll')) {
            if (@($files | Where-Object { $_ -like $pat }).Count -eq 0) { $missing += $pat }
          }
          if ($missing.Count -gt 0) { throw "merged package missing required files: $($missing -join ', ')" }

          "stage=$stage" >> $env:GITHUB_OUTPUT

      - name: BUILD-METADATA.json, PE validation, hashes and final ZIP
        id: meta
        shell: pwsh
        env:
          SOURCE_HEAD_SHA: ${{ steps.preflight.outputs.source_head_sha }}
          SOURCE_WORKFLOW: ${{ steps.preflight.outputs.source_workflow }}
        run: |
          $stage = '${{ steps.merge.outputs.stage }}'
          $shortTma = $env:SOURCE_TMA_SHA.Substring(0, 10).ToLowerInvariant()
          $zipName = "llama-win-cuda${env:CUDA_VERSION}-sm120a-tma-${shortTma}.zip"

          # Canonical fields below match pe_validate.py.  The package-only run
          # does not compile anything, so unavailable exact source-toolchain
          # patch versions are recorded truthfully instead of being invented.
          $metadata = [ordered]@{
            variant                    = 'tma'
            packaging_mode             = 'reuse-existing-actions-artifacts'
            packaging_timestamp        = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            source_actions_run_id       = $env:SOURCE_RUN_ID
            source_workflow             = $env:SOURCE_WORKFLOW
            source_workflow_head_sha    = $env:SOURCE_HEAD_SHA
            source_sha                  = $env:SOURCE_TMA_SHA.ToLowerInvariant()
            upstream_base_sha           = '16378d93f94012d4228c8c7683adce3f286aee5d'
            tma_sha                     = $env:SOURCE_TMA_SHA.ToLowerInvariant()
            tma_short_sha               = $shortTma
            original_pr_sha             = '10247a1a207746b92050c7cbb6855f45f8242c9f'
            pr                          = '#28572'
            msvc_version                = 'VS2022 toolchain from windows-2022 source Actions run 34794445056 (exact toolset version was not persisted in source artifacts)'
            cuda_version                = $env:CUDA_VERSION
            cmake_version               = 'CMake from windows-2022 source Actions run 34794445056 (exact version was not persisted in source artifacts)'
            ninja_version               = 'Ninja from windows-2022 source Actions run 34794445056 (exact version was not persisted in source artifacts)'
            cuda_architecture           = '120a-real'
            build_configuration         = 'Release'
            cuda                        = $env:CUDA_VERSION
            cmake_cuda_architectures    = '120a-real'
            configuration               = 'Release'
            target_gpu                  = 'NVIDIA GeForce RTX 5090 (Blackwell, SM120)'
            binary_provenance           = 'reused unchanged from source_actions_run_id artifacts; this workflow performs no compilation'
            source_toolchain_provenance = 'source Actions run 34794445056; exact MSVC/CMake/Ninja patch versions were not persisted in the reusable artifacts'
            github_packaging_run_id     = $env:GITHUB_RUN_ID
            github_runner_image         = $env:RUNNER_IMAGE
            gpu_validation              = 'REQUIRES LOCAL RTX 5090 VALIDATION - GPU runtime NOT verified on the CI runner'
          }
          $metadata | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $stage 'BUILD-METADATA.json') -Encoding utf8

          # pe_validate.py requires SHA256SUMS.txt to exist.  Generate a
          # preliminary manifest before validation; exclude the manifest itself
          # so there is no self-hash recursion.
          Push-Location $stage
          $lines = @()
          foreach ($f in (Get-ChildItem -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' } | Sort-Object Name)) {
            $h = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
            $lines += ("{0}  {1}" -f $h, $f.Name)
          }
          $lines | Set-Content 'SHA256SUMS.txt' -Encoding utf8
          Pop-Location

          $report = Join-Path $env:RUNNER_TEMP 'PE-VALIDATE-REPORT.json'
          $env:PYTHONIOENCODING = 'utf8'
          $env:PYTHONUTF8 = '1'
          python .github/scripts/pe_validate.py $stage --json $report
          $rc = $LASTEXITCODE
          if (Test-Path $report) { Get-Content $report | ForEach-Object { Write-Host $_ } }
          if ($rc -ne 0) { throw "PE dependency-closure validation FAILED" }
          Copy-Item $report (Join-Path $stage 'PE-VALIDATE-REPORT.json') -Force

          # Regenerate the final manifest after adding the PE report so every
          # final package payload file is covered (except the manifest itself).
          Push-Location $stage
          $lines = @()
          foreach ($f in (Get-ChildItem -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' } | Sort-Object Name)) {
            $h = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
            $lines += ("{0}  {1}" -f $h, $f.Name)
          }
          $lines | Set-Content 'SHA256SUMS.txt' -Encoding utf8
          Pop-Location

          $zipPath = Join-Path $env:RUNNER_TEMP $zipName
          Compress-Archive -Path "$stage\*" -DestinationPath $zipPath -Force
          "zip_name=$zipName" >> $env:GITHUB_OUTPUT
          "zip_path=$zipPath" >> $env:GITHUB_OUTPUT
          Write-Host "Created $zipName"

      - name: Validate final ZIP structure and hashes
        shell: pwsh
        run: |
          $checkDir = Join-Path $env:RUNNER_TEMP 'zipcheck-tma-reuse'
          if (Test-Path $checkDir) { Remove-Item $checkDir -Recurse -Force }
          New-Item -ItemType Directory -Path $checkDir -Force | Out-Null
          Expand-Archive -Path '${{ steps.meta.outputs.zip_path }}' -DestinationPath $checkDir -Force

          $must = @(
            'llama-server.exe',
            'llama-server-impl.dll',
            'llama-bench.exe',
            'llama.dll',
            'llama-common.dll',
            'ggml.dll',
            'ggml-base.dll',
            'ggml-cuda.dll',
            'BUILD-METADATA.json',
            'SHA256SUMS.txt',
            'PE-VALIDATE-REPORT.json'
          )
          $missing = @()
          foreach ($m in $must) {
            if (-not (Test-Path (Join-Path $checkDir $m))) { $missing += $m }
          }
          if (@(Get-ChildItem $checkDir -Filter 'ggml-cpu-*.dll').Count -eq 0) { $missing += 'ggml-cpu-*.dll' }
          foreach ($pat in @('cudart64_*.dll','cublas64_*.dll','cublasLt64_*.dll')) {
            if (@(Get-ChildItem $checkDir -Filter $pat).Count -eq 0) { $missing += $pat }
          }
          if ($missing.Count -gt 0) { throw "ZIP missing required files: $($missing -join ', ')" }

          foreach ($line in (Get-Content (Join-Path $checkDir 'SHA256SUMS.txt'))) {
            $parts = $line -split '\s+'
            if ($parts.Count -lt 2) { continue }
            $actual = (Get-FileHash (Join-Path $checkDir $parts[1]) -Algorithm SHA256).Hash.ToLower()
            if ($actual -ne $parts[0]) { throw "hash mismatch for $($parts[1]): $actual != $($parts[0])" }
          }

          $meta = Get-Content (Join-Path $checkDir 'BUILD-METADATA.json') -Raw | ConvertFrom-Json
          if ($meta.source_actions_run_id -ne $env:SOURCE_RUN_ID) {
            throw "metadata source_actions_run_id mismatch"
          }
          if ($meta.tma_sha -ne $env:SOURCE_TMA_SHA.ToLowerInvariant()) {
            throw "metadata tma_sha mismatch"
          }
          if ($meta.build_configuration -ne 'Release') {
            throw "metadata build_configuration mismatch"
          }
          Write-Host "ZIP validation OK; no compilation was performed in this workflow."

      - name: Upload final TMA package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.zip_name }}
          path: ${{ steps.meta.outputs.zip_path }}
          retention-days: 14

  publish-release:
    if: inputs.publish_release == true && needs.package-existing-artifacts.result == 'success'
    needs: [package-existing-artifacts]
    runs-on: windows-2022
    steps:
      - name: Download final TMA package
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.package-existing-artifacts.outputs.zip_name }}
          path: dist

      - name: Create release with asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $assets = @(Get-ChildItem dist -Filter 'llama-win-cuda*-sm120a-tma-*.zip' | ForEach-Object { $_.FullName })
          if ($assets.Count -ne 1) { throw "expected exactly one final TMA ZIP, found $($assets.Count)" }
          $assetName = Split-Path $assets[0] -Leaf
          $m = [regex]::Match($assetName, '-tma-([0-9a-f]+)\.zip$')
          $shortSha = if ($m.Success) { $m.Groups[1].Value } else { 'unknown' }
          $date = (Get-Date).ToUniversalTime().ToString('yyyyMMdd')
          $tag = "blackwell-tma-${date}-${shortSha}"
          $notes = @"
          Blackwell (RTX 5090 / SM120a) TMA Windows x64 CUDA build repackaged from existing GitHub Actions artifacts.

          Source Actions run: $env:SOURCE_RUN_ID
          TMA source SHA: $env:SOURCE_TMA_SHA
          Asset: $assetName

          This packaging workflow performed no compilation. See BUILD-METADATA.json and the source Actions run for provenance.
          GPU runtime validation: NOT performed on CI. REQUIRES LOCAL RTX 5090 VALIDATION.
          "@
          gh release delete "$tag" --yes --cleanup-tag 2>$null
          gh release create "$tag" $assets[0] --title "$tag" --notes $notes --target master
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
