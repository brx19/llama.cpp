# Blackwell (RTX 5090 / SM120a) native Windows x64 CUDA build workflow
#
# Builds llama.cpp on GitHub-hosted Windows runners for the NVIDIA RTX 5090
# (Blackwell, compute capability 12.0). No GPU is required on the runner -
# CUDA device code is cross-compiled for 120a-real.
#
# Variants (selected via the 'variant' workflow_dispatch input):
#   stock     - current upstream/master as the performance baseline
#   tma       - blackwell/tma branch (cp.async/TMA NVFP4 MMQ pipeline, PR #28572)
#   cutlass   - blackwell/cutlass branch (CUTLASS SM120 MoE prefill, PR #26704)
#   all       - every valid variant (stock, tma, cutlass)
#
# Combined variant is intentionally NOT supported: the TMA kernel and the
# CUTLASS repack path are mutually exclusive at runtime for NVFP4
# (see BLACKWELL-BUILD.md, section "Combined variant").
#
# Design note: the variant -> branch mapping uses three FIXED jobs
# (build-stock, build-tma, build-cutlass), each with a static VARIANT env
# and an `if:` gate on the 'variant' input. 'all' runs all three; a single
# selection runs one.
#
# Long-term storage: GitHub Releases (see "publish-release" job).
# Convenience: short-lived Actions artifacts.
#
# NOTE: GPU runtime validation is NOT performed here (no RTX 5090 on the
# runner). All ZIPs are marked REQUIRES LOCAL RTX 5090 VALIDATION.
#
# ---------------------------------------------------------------------------
# Packaging / validation notes (added 2026-09-12)
# ---------------------------------------------------------------------------
# The Ninja Multi-Config generator IGNORES -DCMAKE_BUILD_TYPE; the build
# config is selected with `cmake --build build --config Release`. The
# earlier workflow passed -DCMAKE_BUILD_TYPE=Release only, which silently
# produced a DEBUG build (VCRUNTIME140D / MSVCP140D / ucrtbased imports)
# and a package missing llama-server-impl.dll. Every build step therefore:
#   1. builds explicitly with `--config Release`
#   2. collects the runtime package from a single, verified Release output
#      directory (no recursive tree-wide file gathering, so Debug/Release
#      artifacts can never be mixed)
#   3. stages the CUDA runtime DLLs produced by the SAME CUDA toolkit that
#      the build used (cudart / libcublas / nvvm / nvrtc / visual_studio
#      integration / cccl), never from a pre-existing local runtime
#   4. records complete toolchain provenance in BUILD-METADATA.json
#      (msvc / cmake / ninja / cuda versions, arch, source SHA, upstream
#      SHA, variant, cmake args, build_configuration = Release); empty
#      provenance fields FAIL the job instead of being silently written
#   5. runs .github/scripts/pe_validate.py which parses the real PE import
#      tables of every packaged binary, resolves the dependency closure from
#      llama-server.exe + llama-bench.exe, and FAILS the job if:
#        - any production binary imports a DEBUG CRT (VCRUNTIME140D,
#          MSVCP140D, VCRUNTIME140_1D, ucrtbased, ...)
#        - llama-server-impl.dll (or any other required backend DLL) is
#          missing
#        - any closure dependency is unresolved (not in the package, not a
#          system DLL, not a known runtime)
#        - BUILD-METADATA.json has empty/missing provenance fields or
#          build_configuration != Release
#        - SHA256SUMS entries do not match the staged files
#      A string-scan for debug-CRT names is kept as a secondary guard.
#   6. generates a dependency report (PE-VALIDATE-REPORT.json) and an
#      OFFICIAL vs CUSTOM package comparison (OFFICIAL-COMPARISON.json)
#      against the current official ggml-org Windows CUDA x64 release, so
#      intentional omissions are documented rather than accidental.

name: CI (Blackwell, windows)

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Build variant: stock | tma | cutlass | all"
        type: choice
        default: all
        options:
          - stock
          - tma
          - cutlass
          - all
      publish_release:
        description: "Publish successful builds to a GitHub Release"
        type: boolean
        default: false

env:
  CUDA_VERSION: "13.3"
  CUDA_PKG: x64

permissions:
  contents: write
  actions: write

# Shared steps template is inlined per job (Actions has no cross-job step
# reuse). Each build-* job is self-contained.

jobs:
  # ---------------------------------------------------------------- stock
  build-stock:
    if: inputs.variant == 'all' || inputs.variant == 'stock'
    runs-on: windows-2022
    name: build (stock, cuda13.3, sm120a)
    env:
      VARIANT: stock
    steps:
      - name: Map variant to source branch
        id: map
        shell: pwsh
        run: |
          switch ($env:VARIANT) {
            'stock'   { $b = 'master' }
            'tma'     { $b = 'blackwell/tma' }
            'cutlass' { $b = 'blackwell/cutlass' }
            default   { throw "unknown variant $env:VARIANT" }
          }
          "branch=$b" >> $env:GITHUB_OUTPUT
          Write-Host "variant=$env:VARIANT branch=$b"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: brx19/llama.cpp
          ref: ${{ steps.map.outputs.branch }}
          fetch-depth: 20

      - name: Record source provenance
        id: src
        shell: pwsh
        run: |
          $sha  = (git rev-parse HEAD).Trim()
          $short = $sha.Substring(0,10)
          # upstream base = fork master HEAD (master is the upstream mirror + tooling)
          $base = (git ls-remote origin refs/heads/master | ForEach-Object { ($_ -split '\t')[0] }).Trim()
          if (-not $base) { $base = $sha }
          "sha=$sha" >> $env:GITHUB_OUTPUT
          "short_sha=$short" >> $env:GITHUB_OUTPUT
          "branch=${{ steps.map.outputs.branch }}" >> $env:GITHUB_OUTPUT
          "base_sha=$base" >> $env:GITHUB_OUTPUT
          Write-Host "source_sha=$sha base_sha=$base"

      - name: Install Cuda Toolkit 13.3
        uses: ./.github/actions/windows-setup-cuda
        with:
          cuda_version: ${{ env.CUDA_VERSION }}
          cuda_arch: ${{ env.CUDA_PKG }}

      - name: Install Ninja
        shell: pwsh
        run: choco install ninja -y

      - name: Record toolchain versions
        id: toolchain
        shell: pwsh
        run: |
          # MSVC version: query cl after sourcing vcvars (x64)
          $vcvars = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat"
          if (-not (Test-Path $vcvars)) {
            $vcvars = "C:\Program Files\Microsoft Visual Studio\2022\Community\VC\Auxiliary\Build\vcvarsall.bat"
          }
          # cl with no args prints usage to stderr; cl /? prints full help
          # (including the version banner) to stdout reliably.
          $clOut = (& cmd /c "`"$vcvars`" x64 >nul 2>&1 && cl /? 2>&1") -join "`n"
          $m = [regex]::Match($clOut, 'Version\s+(\d+\.\d+\.\d+(?:\.\d+)?)')
          if (-not $m.Success) { throw "MSVC version detection FAILED: cl /? output was:`n$clOut" }
          "msvc_version=$($m.Groups[1].Value)" >> $env:GITHUB_OUTPUT
          $nvccOut = & "$env:CUDA_PATH\bin\nvcc.exe" --version 2>&1
          $m = [regex]::Match(($nvccOut -join "`n"), 'release (\d+\.\d+)')
          if (-not $m.Success) { throw "CUDA version detection FAILED: nvcc output was:`n$nvccOut" }
          "cuda_version=$($m.Groups[1].Value)" >> $env:GITHUB_OUTPUT
          $cmOut = & cmake --version
          $m = [regex]::Match(($cmOut -join "`n"), 'version (\d+\.\d+\.\d+)')
          if (-not $m.Success) { throw "CMake version detection FAILED: `n$cmOut" }
          "cmake_version=$($m.Groups[1].Value)" >> $env:GITHUB_OUTPUT
          $ninjaOut = & ninja --version
          if (-not $ninjaOut) { throw "Ninja version detection FAILED" }
          "ninja_version=$($ninjaOut.Trim())" >> $env:GITHUB_OUTPUT
          Write-Host "toolchain: msvc=$($m.Groups[1].Value) cuda=$(Get-Content $env:GITHUB_OUTPUT | Select-String '^cuda_version' | ForEach-Object { ($_ -split '=')[1] })"

      - name: Configure (multi-config, Release selected at build time)
        id: configure
        shell: pwsh
        run: |
          # NOTE: do NOT pass -DCMAKE_CUDA_ARCHITECTURES here. CMake's CUDA
          # language enablement sets it to "native" (shadowing any -D cache
          # value), and llama.cpp's ggml-cuda/CMakeLists.txt only auto-selects
          # architectures (including 120a-real for CUDA >= 12.8) when the
          # variable is left undefined and GGML_NATIVE=OFF. The verify step
          # below checks that 120a-real appears in the resolved arch list.
          #
          # NOTE: -DCMAKE_BUILD_TYPE is IGNORED by the Ninja Multi-Config
          # generator. The Release config is selected explicitly at build
          # time with `cmake --build build --config Release`.
          $cmakeArgs = @('-DGGML_CUDA=ON','-DGGML_BACKEND_DL=ON','-DGGML_NATIVE=OFF')
          # CRITICAL: explicitly set the MSVC compilers so CMake/Ninja does not
          # fall back to a bare cl on the runner's default PATH (which lacks the
          # vcvars include/lib environment and fails with C1083 stdbool.h).
          $cmakeArgs += '-DCMAKE_C_COMPILER=cl'
          $cmakeArgs += '-DCMAKE_CXX_COMPILER=cl'
          $cmakeArgs += '-DCMAKE_BUILD_TYPE=Release'
          $cmakeArgs | Out-File -FilePath $env:RUNNER_TEMP/cmake_args.txt -Encoding utf8
          Write-Host "CMake args: $($cmakeArgs -join ' ')"
          # Source vcvarsall into THIS session so cl.exe is on PATH for CMake's
          # CUDA compiler-id detection (nvcc needs cl.exe as the host compiler).
          $vcvars = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat"
          if (-not (Test-Path $vcvars)) {
            $vcvars = "C:\Program Files\Microsoft Visual Studio\2022\Community\VC\Auxiliary\Build\vcvarsall.bat"
          }
          $envDump = & cmd /c "`"$vcvars`" x64 >nul && set"
          foreach ($line in $envDump) {
            if ($line -match '^([A-Za-z_][A-Za-z0-9_]*)=(.*)$') {
              [Environment]::SetEnvironmentVariable($Matches[1], $Matches[2], 'Process')
            }
          }
          Write-Host "MSVC env exported. cl.exe on PATH: $(if (Get-Command cl -ErrorAction SilentlyContinue) { 'yes' } else { 'NO' })"
          & cmake -S . -B build -G `Ninja Multi-Config` $($cmakeArgs -join ' ') 2>&1 | Tee-Object -FilePath $env:RUNNER_TEMP/configure.log
          if ($LASTEXITCODE -ne 0) { throw "cmake configure failed (exit $LASTEXITCODE)" }

      - name: Build (Release, explicit --config)
        id: build
        shell: pwsh
        run: |
          $jobs = [Environment]::ProcessorCount
          & cmake --build build --config Release -j $jobs 2>&1 | Tee-Object -FilePath $env:RUNNER_TEMP/build.log
          if ($LASTEXITCODE -ne 0) { throw "cmake build failed (exit $LASTEXITCODE)" }
          # Ninja Multi-Config + --config Release places outputs in build\bin
          # (not build\bin\Release). Search both to be safe, and verify the
          # expected artifacts exist before reporting the bin dir.
          $binDir = "build\bin"
          if (-not (Test-Path (Join-Path $binDir "llama-server.exe"))) { $binDir = "build\bin\Release" }
          foreach ($exe in @('llama-server.exe','llama-bench.exe')) {
            if (-not (Test-Path (Join-Path $binDir $exe))) { throw "build did not produce $exe in $binDir" }
          }
          # Verify the built binaries are RELEASE (not Debug): a Debug build
          # imports VCRUNTIME140D.dll / ucrtbased.dll, a Release build does
          # not. Fail early if we somehow built Debug.
          foreach ($exe in @('llama-server.exe','llama-bench.exe')) {
            $blob = [System.IO.File]::ReadAllBytes((Join-Path $binDir $exe))
            $text = [System.Text.Encoding]::ASCII.GetString($blob)
            if ($text.Contains('VCRUNTIME140D.dll') -or $text.Contains('ucrtbased.dll')) {
              throw "$exe is a DEBUG build (imports debug CRT). The build must be Release."
            }
          }
          "bin_dir=$binDir" >> $env:GITHUB_OUTPUT
          Write-Host "Build OK (Release). bin dir: $binDir"

      - name: Collect runtime package (Release only, explicit file list)
        id: pkg
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "package-$env:VARIANT"
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          $binDir = '${{ steps.build.outputs.bin_dir }}'
          # Build-produced binaries: collect EXPLICITLY from the verified
          # Release output directory (never a recursive tree-wide gather, so
          # Debug and Release artifacts can never be mixed).
          $buildExes = Get-ChildItem "$binDir\*.exe" | ForEach-Object { $_.Name }
          $buildDlls = Get-ChildItem "$binDir\*.dll" | Where-Object { $_.Name -like 'ggml*.dll' -or $_.Name -like 'llama*.dll' -or $_.Name -like 'mtmd*.dll' -or $_.Name -like 'libomp*.dll' } | ForEach-Object { $_.Name }
          Write-Host "Build binaries from $binDir:"
          $buildExes | ForEach-Object { Write-Host "  exe  $_" }
          $buildDlls | ForEach-Object { Write-Host "  dll  $_" }
          foreach ($name in ($buildExes + $buildDlls)) {
            Copy-Item (Join-Path $binDir $name) $stage -ErrorAction Stop
          }
          # CUDA runtime DLLs from the EXACT CUDA toolkit this build used
          # (installed by the windows-setup-cuda action into $env:CUDA_PATH).
          # The build links cudart + cublas + cublasLt; nvvm/nvrtc are
          # included for JIT completeness. These are the same component
          # versions the build was compiled against.
          $cudaDir = $env:CUDA_PATH
          if (-not $cudaDir) { throw "CUDA_PATH is not set; cannot stage CUDA runtime DLLs" }
          $cudaComponents = @('cudart','libcublas','libnvvm','cuda_nvrtc','cuda_nvtx','cuda_profiler_api','visual_studio_integration','cccl')
          $stagedCuda = @()
          foreach ($d in $cudaComponents) {
            $dir = Join-Path $cudaDir $d
            if (Test-Path $dir) {
              Get-ChildItem $dir -Filter *.dll | ForEach-Object {
                Copy-Item $_.FullName $stage -Force
                $stagedCuda += $_.Name
              }
            }
          }
          Get-ChildItem "$cudaDir\bin" -Filter 'cublasLt*.dll' | ForEach-Object {
            Copy-Item $_.FullName $stage -Force
            $stagedCuda += $_.Name
          }
          Get-ChildItem "$cudaDir\bin" -Filter 'nvvm*.dll' | ForEach-Object {
            Copy-Item $_.FullName $stage -Force
            $stagedCuda += $_.Name
          }
          Write-Host "CUDA runtime DLLs staged from $cudaDir:"
          $stagedCuda | ForEach-Object { Write-Host "  cuda $_" }
          # Sanity: the package must contain the CUDA runtime the build needs.
          $allCuda = (Get-ChildItem $stage -Filter *.dll).Name
          if (-not ($allCuda | Where-Object { $_ -like 'cudart*' -or $_ -like 'nvcudart*' })) {
            throw "no cudart DLL staged; the package would not run standalone"
          }
          if (-not ($allCuda | Where-Object { $_ -like 'cublas*' })) {
            throw "no cublas DLL staged; the package would not run standalone"
          }
          Write-Host "Package contents:"
          Get-ChildItem $stage | ForEach-Object { Write-Host ("  {0,-28} {1,12:N0} bytes" -f $_.Name, $_.Length) }
          "stage=$stage" >> $env:GITHUB_OUTPUT
          "cuda_dlls=$($stagedCuda -join ';')" >> $env:GITHUB_OUTPUT

      - name: Build metadata + SHA256 (complete provenance, no empty fields)
        id: meta
        shell: pwsh
        run: |
          $stage       = '${{ steps.pkg.outputs.stage }}'
          $variant     = $env:VARIANT
          $cudaVersion = '${{ steps.toolchain.outputs.cuda_version }}'
          $shortSha    = '${{ steps.src.outputs.short_sha }}'
          $zipName     = "llama-win-cuda${cudaVersion}-sm120a-${variant}-${shortSha}.zip"
          $cutlassEnabled = ($variant -eq 'cutlass')
          $cutlassRev = 'n/a'
          if ($cutlassEnabled) {
            $cmakeContent = Get-Content ggml/src/ggml-cuda/CMakeLists.txt -Raw
            $m = [regex]::Match($cmakeContent, '(CUTLASS|cutlass)[^\r\n]*(?:GIT_TAG|URL)[^\r\n]*?([v\d][\w./-]*)')
            if ($m.Success) { $cutlassRev = $m.Groups[2].Value } else { $cutlassRev = 'see ggml/src/ggml-cuda/CMakeLists.txt' }
          }
          $metadata = [ordered]@{
            variant                 = $variant
            build_timestamp         = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            source_branch           = '${{ steps.src.outputs.branch }}'
            source_sha              = '${{ steps.src.outputs.sha }}'
            source_short_sha        = $shortSha
            upstream_base_sha       = '${{ steps.src.outputs.base_sha }}'
            original_pr_sha         = switch ($variant) { 'tma' { '10247a1a207746b92050c7cbb6855f45f8242c9f (PR #28572 head)' } 'cutlass' { '94ee2c759734c697ecaa0cb05058cda4f46b42e3 (PR #26704 head)' } default { 'n/a (stock = upstream master)' } }
            github_actions_run_id   = $env:GITHUB_RUN_ID
            github_runner_image     = $env:RUNNER_IMAGE
            msvc_version            = '${{ steps.toolchain.outputs.msvc_version }}'
            cuda_version            = $cudaVersion
            cuda_component_versions = (Get-Content $env:RUNNER_TEMP/cuda_packages.json -Raw | ConvertFrom-Json)
            cmake_version           = '${{ steps.toolchain.outputs.cmake_version }}'
            ninja_version           = '${{ steps.toolchain.outputs.ninja_version }}'
            cmake_arguments         = (Get-Content $env:RUNNER_TEMP/cmake_args.txt)
            cuda_architecture       = '120a-real'
            build_configuration     = 'Release'
            cutlass_enabled         = $cutlassEnabled
            cutlass_revision        = $cutlassRev
            target_gpu              = 'NVIDIA GeForce RTX 5090 (Blackwell, SM120)'
            gpu_validation          = 'REQUIRES LOCAL RTX 5090 VALIDATION - GPU runtime NOT verified on the CI runner'
          }
          # HARD PROVENANCE CHECK: every important field must be non-empty.
          $requiredFields = @('variant','source_sha','upstream_base_sha','msvc_version','cuda_version','cmake_version','ninja_version','cuda_architecture','build_configuration')
          $missing = @()
          foreach ($k in $requiredFields) {
            $val = $metadata[$k]
            if ([string]::IsNullOrWhiteSpace([string]$val)) { $missing += $k }
          }
          if ($missing.Count -gt 0) { throw "BUILD-METADATA provenance fields empty/missing: $($missing -join ', ')" }
          if ($metadata.build_configuration -ne 'Release') { throw "build_configuration is $($metadata.build_configuration), expected Release" }
          $metadata | ConvertTo-Json -Depth 5 | Set-Content "$stage\BUILD-METADATA.json" -Encoding utf8
          Push-Location $stage
          $lines = @()
          foreach ($f in (Get-ChildItem -File | Where-Object { $_.Extension -in '.exe','.dll' } | Sort-Object Name)) {
            $h = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
            $lines += ("{0}  {1}" -f $h, $f.Name)
          }
          $lines | Set-Content 'SHA256SUMS.txt' -Encoding utf8
          Pop-Location
          Write-Host "Metadata + SHA256 written. Required-file check:"
          $required = @('llama-server.exe','llama-bench.exe','llama-server-impl.dll','ggml.dll','ggml-base.dll','ggml-cuda.dll','ggml-cpu-x64.dll','BUILD-METADATA.json','SHA256SUMS.txt')
          $missingFiles = @()
          foreach ($req in $required) {
            $ok = Test-Path (Join-Path $stage $req)
            Write-Host ("  {0,-24} {1}" -f $req, $(if ($ok) { 'OK' } else { 'MISSING' }))
            if (-not $ok) { $missingFiles += $req }
          }
          if ($missingFiles.Count -gt 0) { throw "required package files missing: $($missingFiles -join ', ')" }
          $zipPath = Join-Path $env:RUNNER_TEMP $zipName
          Compress-Archive -Path "$stage\*" -DestinationPath $zipPath -Force
          "zip_name=$zipName" >> $env:GITHUB_OUTPUT
          "zip_path=$zipPath" >> $env:GITHUB_OUTPUT
          Write-Host "Created $zipName"

      - name: Validate PE dependency closure (FAIL on debug CRT / missing DLLs)
        id: validate
        shell: pwsh
        run: |
          # The authoritative PE import-table validator. It parses every
          # packaged .exe/.dll, resolves the dependency closure from
          # llama-server.exe + llama-bench.exe, and FAILS if any production
          # binary imports a debug CRT, if llama-server-impl.dll (or another
          # required backend) is missing, if any closure dependency is
          # unresolved, if BUILD-METADATA provenance is incomplete, or if
          # SHA256SUMS do not match.
          $stage = '${{ steps.pkg.outputs.stage }}'
          $report = Join-Path $env:RUNNER_TEMP "PE-VALIDATE-REPORT.json"
          python "$env:GITHUB_WORKSPACE\.github\scripts\pe_validate.py" "$stage" --json "$report"
          $rc = $LASTEXITCODE
          Write-Host "PE validation exit code: $rc"
          Get-Content "$report" | ForEach-Object { Write-Host $_ }
          if ($rc -ne 0) { throw "PE dependency-closure validation FAILED (see report above)" }
          # Copy the report into the package so it ships with the ZIP.
          Copy-Item "$report" (Join-Path $stage "PE-VALIDATE-REPORT.json") -Force

      - name: Compare package against official llama.cpp Windows CUDA release
        id: compare
        shell: pwsh
        run: |
          # Download the current official ggml-org Windows CUDA x64 release
          # (main + cudart zips), list its runtime files, and diff against
          # our package. This documents WHY our release is smaller: the
          # official package ships every example tool + all CPU micro-arch
          # backends; we ship the core runtime + CUDA + the CPU backends our
          # build produces. Intentional omissions are listed, not accidental.
          $stage = '${{ steps.pkg.outputs.stage }}'
          $officialDir = Join-Path $env:RUNNER_TEMP 'official-win'
          New-Item -ItemType Directory -Path $officialDir -Force | Out-Null
          # Find the newest release with a win-cuda-13.3-x64 asset.
          $releases = & gh release list --repo ggml-org/llama.cpp --limit 30 --json tagName,assets 2>$null | ConvertFrom-Json
          $officialZip = $null
          $cudartZip = $null
          foreach ($r in $releases) {
            foreach ($a in $r.assets) {
              if ($a.name -like 'llama-*-bin-win-cuda-13.3-x64.zip' -and -not $officialZip) { $officialZip = $a }
              if ($a.name -like 'cudart-*-bin-win-cuda-13.3-x64.zip' -and -not $cudartZip) { $cudartZip = $a }
            }
            if ($officialZip -and $cudartZip) { break }
          }
          if (-not $officialZip) { throw "could not find official win-cuda-13.3-x64 release asset to compare against" }
          Write-Host "Comparing against official asset: $($officialZip.name)"
          & curl -sL -o (Join-Path $officialDir 'official-main.zip') $officialZip.browser_download_url
          $officialFiles = @()
          $z = [System.IO.Compression.ZipFile]::OpenRead((Join-Path $officialDir 'official-main.zip'))
          foreach ($e in $z.Entries) { if ($e.FullName -notlike '*/') { $officialFiles += [System.IO.Path]::GetFileName($e.FullName) } }
          $z.Dispose()
          if ($cudartZip) {
            Write-Host "Including official cudart asset: $($cudartZip.name)"
            & curl -sL -o (Join-Path $officialDir 'official-cudart.zip') $cudartZip.browser_download_url
            $z2 = [System.IO.Compression.ZipFile]::OpenRead((Join-Path $officialDir 'official-cudart.zip'))
            foreach ($e in $z2.Entries) { if ($e.FullName -notlike '*/') { $officialFiles += [System.IO.Path]::GetFileName($e.FullName) } }
            $z2.Dispose()
          }
          $officialFiles = @($officialFiles | Sort-Object -Unique)
          $ourFiles = @((Get-ChildItem $stage -File | Where-Object { $_.Extension -in '.exe','.dll' } | ForEach-Object { $_.Name }) | Sort-Object)
          $missing = @($officialFiles | Where-Object { $_ -notin $ourFiles })
          $extra   = @($ourFiles | Where-Object { $_ -notin $officialFiles })
          $cmp = [ordered]@{
            official_asset       = $officialZip.name
            official_file_count  = $officialFiles.Count
            custom_file_count    = $ourFiles.Count
            missing_from_custom  = $missing
            extra_in_custom      = $extra
            note                 = 'Official package ships every example tool and all CPU micro-architecture backends. Custom package ships the core runtime + CUDA + the CPU backends this build produces. Files in missing_from_custom are intentional omissions (extra example tools / CPU micro-arch backends) unless they are a core runtime dependency.'
          }
          $cmp | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $stage 'OFFICIAL-COMPARISON.json') -Encoding utf8
          Write-Host "OFFICIAL PACKAGE ($($officialFiles.Count) files): $($officialFiles -join ', ')"
          Write-Host ""
          Write-Host "CUSTOM PACKAGE ($($ourFiles.Count) files): $($ourFiles -join ', ')"
          Write-Host ""
          Write-Host "MISSING FROM CUSTOM ($($missing.Count)):"
          $missing | ForEach-Object { Write-Host "  - $_" }
          Write-Host ""
          Write-Host "EXTRA IN CUSTOM ($($extra.Count)):"
          $extra | ForEach-Object { Write-Host "  + $_" }
          # Re-ZIP after adding the reports so the ZIP contains everything.
          $zipPath = '${{ steps.meta.outputs.zip_path }}'
          $zipName = '${{ steps.meta.outputs.zip_name }}'
          Compress-Archive -Path "$stage\*" -DestinationPath $zipPath -Force
          Write-Host "Re-created $zipName with validation reports included."

      - name: Validate ZIP structure
        shell: pwsh
        run: |
          $checkDir = Join-Path $env:RUNNER_TEMP "zipcheck-${env:VARIANT}"
          Expand-Archive -Path '${{ steps.meta.outputs.zip_path }}' -DestinationPath $checkDir -Force
          $must = @('llama-server.exe','llama-bench.exe','llama-server-impl.dll','ggml.dll','ggml-base.dll','ggml-cuda.dll','ggml-cpu-x64.dll','BUILD-METADATA.json','SHA256SUMS.txt','PE-VALIDATE-REPORT.json','OFFICIAL-COMPARISON.json')
          $missing = @()
          foreach ($m in $must) { if (-not (Test-Path (Join-Path $checkDir $m))) { $missing += $m } }
          if ($missing.Count -gt 0) { throw "ZIP missing required files: $($missing -join ', ')" }
          $null = Get-Content (Join-Path $checkDir 'BUILD-METADATA.json') -Raw | ConvertFrom-Json
          foreach ($line in (Get-Content (Join-Path $checkDir 'SHA256SUMS.txt'))) {
            $parts = $line -split '\s+'
            if ($parts.Count -lt 2) { continue }
            $actual = (Get-FileHash (Join-Path $checkDir $parts[1]) -Algorithm SHA256).Hash.ToLower()
            if ($actual -ne $parts[0]) { throw "hash mismatch for $($parts[1]): $actual != $($parts[0])" }
          }
          Write-Host "ZIP validation OK: $($must -join ', ')"

      - name: Query executable version metadata
        shell: pwsh
        run: |
          $checkDir = Join-Path $env:RUNNER_TEMP "zipcheck-${env:VARIANT}"
          foreach ($exe in @('llama-server.exe','llama-bench.exe')) {
            $p = Join-Path $checkDir $exe
            $v = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($p)
            Write-Host "${exe}: ProductName=$($v.ProductName) ProductVersion=$($v.ProductVersion) FileVersion=$($v.FileVersion)"
          }
          Write-Host "NOTE: CUDA initialization not attempted (no GPU on runner)."

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.zip_name }}
          path: ${{ steps.meta.outputs.zip_path }}
          retention-days: 14

  # ----------------------------------------------------------- cutlass
  build-cutlass:
    if: inputs.variant == 'all' || inputs.variant == 'cutlass'
    runs-on: windows-2022
    name: build (cutlass, cuda13.3, sm120a)
    env:
      VARIANT: cutlass
    steps:
      - name: Map variant to source branch
        id: map
        shell: pwsh
        run: |
          switch ($env:VARIANT) {
            'stock'   { $b = 'master' }
            'tma'     { $b = 'blackwell/tma' }
            'cutlass' { $b = 'blackwell/cutlass' }
            default   { throw "unknown variant $env:VARIANT" }
          }
          "branch=$b" >> $env:GITHUB_OUTPUT
          Write-Host "variant=$env:VARIANT branch=$b"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: brx19/llama.cpp
          ref: ${{ steps.map.outputs.branch }}
          fetch-depth: 20

      - name: Record source provenance
        id: src
        shell: pwsh
        run: |
          $sha  = (git rev-parse HEAD).Trim()
          $short = $sha.Substring(0,10)
          $base = (git ls-remote origin refs/heads/master | ForEach-Object { ($_ -split '\t')[0] }).Trim()
          if (-not $base) { $base = $sha }
          "sha=$sha" >> $env:GITHUB_OUTPUT
          "short_sha=$short" >> $env:GITHUB_OUTPUT
          "branch=${{ steps.map.outputs.branch }}" >> $env:GITHUB_OUTPUT
          "base_sha=$base" >> $env:GITHUB_OUTPUT
          Write-Host "source_sha=$sha base_sha=$base"

      - name: Install Cuda Toolkit 13.3
        uses: ./.github/actions/windows-setup-cuda
        with:
          cuda_version: ${{ env.CUDA_VERSION }}
          cuda_arch: ${{ env.CUDA_PKG }}

      - name: Install Ninja
        shell: pwsh
        run: choco install ninja -y

      - name: Record toolchain versions
        id: toolchain
        shell: pwsh
        run: |
          $vcvars = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat"
          if (-not (Test-Path $vcvars)) {
            $vcvars = "C:\Program Files\Microsoft Visual Studio\2022\Community\VC\Auxiliary\Build\vcvarsall.bat"
          }
          # cl with no args prints usage to stderr; cl /? prints full help
          # (including the version banner) to stdout reliably.
          $clOut = (& cmd /c "`"$vcvars`" x64 >nul 2>&1 && cl /? 2>&1") -join "`n"
          $m = [regex]::Match($clOut, 'Version\s+(\d+\.\d+\.\d+(?:\.\d+)?)')
          if (-not $m.Success) { throw "MSVC version detection FAILED: cl /? output was:`n$clOut" }
          "msvc_version=$($m.Groups[1].Value)" >> $env:GITHUB_OUTPUT
          $nvccOut = & "$env:CUDA_PATH\bin\nvcc.exe" --version 2>&1
          $m = [regex]::Match(($nvccOut -join "`n"), 'release (\d+\.\d+)')
          if (-not $m.Success) { throw "CUDA version detection FAILED: nvcc output was:`n$nvccOut" }
          "cuda_version=$($m.Groups[1].Value)" >> $env:GITHUB_OUTPUT
          $cmOut = & cmake --version
          $m = [regex]::Match(($cmOut -join "`n"), 'version (\d+\.\d+\.\d+)')
          if (-not $m.Success) { throw "CMake version detection FAILED: `n$cmOut" }
          "cmake_version=$($m.Groups[1].Value)" >> $env:GITHUB_OUTPUT
          $ninjaOut = & ninja --version
          if (-not $ninjaOut) { throw "Ninja version detection FAILED" }
          "ninja_version=$($ninjaOut.Trim())" >> $env:GITHUB_OUTPUT
          Write-Host "toolchain: msvc=$($m.Groups[1].Value) cuda=$(Get-Content $env:GITHUB_OUTPUT | Select-String '^cuda_version' | ForEach-Object { ($_ -split '=')[1] })"

      - name: Configure (multi-config, Release selected at build time)
        id: configure
        shell: pwsh
        run: |
          $cmakeArgs = @('-DGGML_CUDA=ON','-DGGML_BACKEND_DL=ON','-DGGML_NATIVE=OFF')
          # CRITICAL: explicitly set the MSVC compilers so CMake/Ninja does not
          # fall back to a bare cl on the runner's default PATH (which lacks the
          # vcvars include/lib environment and fails with C1083 stdbool.h).
          $cmakeArgs += '-DCMAKE_C_COMPILER=cl'
          $cmakeArgs += '-DCMAKE_CXX_COMPILER=cl'
          $cmakeArgs += '-DCMAKE_BUILD_TYPE=Release'
          $cmakeArgs | Out-File -FilePath $env:RUNNER_TEMP/cmake_args.txt -Encoding utf8
          Write-Host "CMake args: $($cmakeArgs -join ' ')"
          $vcvars = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat"
          if (-not (Test-Path $vcvars)) {
            $vcvars = "C:\Program Files\Microsoft Visual Studio\2022\Community\VC\Auxiliary\Build\vcvarsall.bat"
          }
          $envDump = & cmd /c "`"$vcvars`" x64 >nul && set"
          foreach ($line in $envDump) {
            if ($line -match '^([A-Za-z_][A-Za-z0-9_]*)=(.*)$') {
              [Environment]::SetEnvironmentVariable($Matches[1], $Matches[2], 'Process')
            }
          }
          Write-Host "MSVC env exported. cl.exe on PATH: $(if (Get-Command cl -ErrorAction SilentlyContinue) { 'yes' } else { 'NO' })"
          & cmake -S . -B build -G `Ninja Multi-Config` $($cmakeArgs -join ' ') 2>&1 | Tee-Object -FilePath $env:RUNNER_TEMP/configure.log
          if ($LASTEXITCODE -ne 0) { throw "cmake configure failed (exit $LASTEXITCODE)" }

      - name: Build (Release, explicit --config)
        id: build
        shell: pwsh
        run: |
          $jobs = [Environment]::ProcessorCount
          & cmake --build build --config Release -j $jobs 2>&1 | Tee-Object -FilePath $env:RUNNER_TEMP/build.log
          if ($LASTEXITCODE -ne 0) { throw "cmake build failed (exit $LASTEXITCODE)" }
          $binDir = "build\bin"
          if (-not (Test-Path (Join-Path $binDir "llama-server.exe"))) { $binDir = "build\bin\Release" }
          foreach ($exe in @('llama-server.exe','llama-bench.exe')) {
            if (-not (Test-Path (Join-Path $binDir $exe))) { throw "build did not produce $exe in $binDir" }
          }
          foreach ($exe in @('llama-server.exe','llama-bench.exe')) {
            $blob = [System.IO.File]::ReadAllBytes((Join-Path $binDir $exe))
            $text = [System.Text.Encoding]::ASCII.GetString($blob)
            if ($text.Contains('VCRUNTIME140D.dll') -or $text.Contains('ucrtbased.dll')) {
              throw "$exe is a DEBUG build (imports debug CRT). The build must be Release."
            }
          }
          "bin_dir=$binDir" >> $env:GITHUB_OUTPUT
          Write-Host "Build OK (Release). bin dir: $binDir"

      - name: Collect runtime package (Release only, explicit file list)
        id: pkg
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "package-$env:VARIANT"
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          $binDir = '${{ steps.build.outputs.bin_dir }}'
          $buildExes = Get-ChildItem "$binDir\*.exe" | ForEach-Object { $_.Name }
          $buildDlls = Get-ChildItem "$binDir\*.dll" | Where-Object { $_.Name -like 'ggml*.dll' -or $_.Name -like 'llama*.dll' -or $_.Name -like 'mtmd*.dll' -or $_.Name -like 'libomp*.dll' } | ForEach-Object { $_.Name }
          Write-Host "Build binaries from $binDir:"
          $buildExes | ForEach-Object { Write-Host "  exe  $_" }
          $buildDlls | ForEach-Object { Write-Host "  dll  $_" }
          foreach ($name in ($buildExes + $buildDlls)) {
            Copy-Item (Join-Path $binDir $name) $stage -ErrorAction Stop
          }
          $cudaDir = $env:CUDA_PATH
          if (-not $cudaDir) { throw "CUDA_PATH is not set; cannot stage CUDA runtime DLLs" }
          $cudaComponents = @('cudart','libcublas','libnvvm','cuda_nvrtc','cuda_nvtx','cuda_profiler_api','visual_studio_integration','cccl')
          $stagedCuda = @()
          foreach ($d in $cudaComponents) {
            $dir = Join-Path $cudaDir $d
            if (Test-Path $dir) {
              Get-ChildItem $dir -Filter *.dll | ForEach-Object {
                Copy-Item $_.FullName $stage -Force
                $stagedCuda += $_.Name
              }
            }
          }
          Get-ChildItem "$cudaDir\bin" -Filter 'cublasLt*.dll' | ForEach-Object {
            Copy-Item $_.FullName $stage -Force
            $stagedCuda += $_.Name
          }
          Get-ChildItem "$cudaDir\bin" -Filter 'nvvm*.dll' | ForEach-Object {
            Copy-Item $_.FullName $stage -Force
            $stagedCuda += $_.Name
          }
          Write-Host "CUDA runtime DLLs staged from $cudaDir:"
          $stagedCuda | ForEach-Object { Write-Host "  cuda $_" }
          $allCuda = (Get-ChildItem $stage -Filter *.dll).Name
          if (-not ($allCuda | Where-Object { $_ -like 'cudart*' -or $_ -like 'nvcudart*' })) {
            throw "no cudart DLL staged; the package would not run standalone"
          }
          if (-not ($allCuda | Where-Object { $_ -like 'cublas*' })) {
            throw "no cublas DLL staged; the package would not run standalone"
          }
          Write-Host "Package contents:"
          Get-ChildItem $stage | ForEach-Object { Write-Host ("  {0,-28} {1,12:N0} bytes" -f $_.Name, $_.Length) }
          "stage=$stage" >> $env:GITHUB_OUTPUT
          "cuda_dlls=$($stagedCuda -join ';')" >> $env:GITHUB_OUTPUT

      - name: Build metadata + SHA256 (complete provenance, no empty fields)
        id: meta
        shell: pwsh
        run: |
          $stage       = '${{ steps.pkg.outputs.stage }}'
          $variant     = $env:VARIANT
          $cudaVersion = '${{ steps.toolchain.outputs.cuda_version }}'
          $shortSha    = '${{ steps.src.outputs.short_sha }}'
          $zipName     = "llama-win-cuda${cudaVersion}-sm120a-${variant}-${shortSha}.zip"
          $cutlassEnabled = ($variant -eq 'cutlass')
          $cutlassRev = 'n/a'
          if ($cutlassEnabled) {
            $cmakeContent = Get-Content ggml/src/ggml-cuda/CMakeLists.txt -Raw
            $m = [regex]::Match($cmakeContent, '(CUTLASS|cutlass)[^\r\n]*(?:GIT_TAG|URL)[^\r\n]*?([v\d][\w./-]*)')
            if ($m.Success) { $cutlassRev = $m.Groups[2].Value } else { $cutlassRev = 'see ggml/src/ggml-cuda/CMakeLists.txt' }
          }
          $metadata = [ordered]@{
            variant                 = $variant
            build_timestamp         = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            source_branch           = '${{ steps.src.outputs.branch }}'
            source_sha              = '${{ steps.src.outputs.sha }}'
            source_short_sha        = $shortSha
            upstream_base_sha       = '${{ steps.src.outputs.base_sha }}'
            original_pr_sha         = switch ($variant) { 'tma' { '10247a1a207746b92050c7cbb6855f45f8242c9f (PR #28572 head)' } 'cutlass' { '94ee2c759734c697ecaa0cb05058cda4f46b42e3 (PR #26704 head)' } default { 'n/a (stock = upstream master)' } }
            github_actions_run_id   = $env:GITHUB_RUN_ID
            github_runner_image     = $env:RUNNER_IMAGE
            msvc_version            = '${{ steps.toolchain.outputs.msvc_version }}'
            cuda_version            = $cudaVersion
            cuda_component_versions = (Get-Content $env:RUNNER_TEMP/cuda_packages.json -Raw | ConvertFrom-Json)
            cmake_version           = '${{ steps.toolchain.outputs.cmake_version }}'
            ninja_version           = '${{ steps.toolchain.outputs.ninja_version }}'
            cmake_arguments         = (Get-Content $env:RUNNER_TEMP/cmake_args.txt)
            cuda_architecture       = '120a-real'
            build_configuration     = 'Release'
            cutlass_enabled         = $cutlassEnabled
            cutlass_revision        = $cutlassRev
            target_gpu              = 'NVIDIA GeForce RTX 5090 (Blackwell, SM120)'
            gpu_validation          = 'REQUIRES LOCAL RTX 5090 VALIDATION - GPU runtime NOT verified on the CI runner'
          }
          $requiredFields = @('variant','source_sha','upstream_base_sha','msvc_version','cuda_version','cmake_version','ninja_version','cuda_architecture','build_configuration')
          $missing = @()
          foreach ($k in $requiredFields) {
            $val = $metadata[$k]
            if ([string]::IsNullOrWhiteSpace([string]$val)) { $missing += $k }
          }
          if ($missing.Count -gt 0) { throw "BUILD-METADATA provenance fields empty/missing: $($missing -join ', ')" }
          if ($metadata.build_configuration -ne 'Release') { throw "build_configuration is $($metadata.build_configuration), expected Release" }
          $metadata | ConvertTo-Json -Depth 5 | Set-Content "$stage\BUILD-METADATA.json" -Encoding utf8
          Push-Location $stage
          $lines = @()
          foreach ($f in (Get-ChildItem -File | Where-Object { $_.Extension -in '.exe','.dll' } | Sort-Object Name)) {
            $h = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
            $lines += ("{0}  {1}" -f $h, $f.Name)
          }
          $lines | Set-Content 'SHA256SUMS.txt' -Encoding utf8
          Pop-Location
          Write-Host "Metadata + SHA256 written. Required-file check:"
          $required = @('llama-server.exe','llama-bench.exe','llama-server-impl.dll','ggml.dll','ggml-base.dll','ggml-cuda.dll','ggml-cpu-x64.dll','BUILD-METADATA.json','SHA256SUMS.txt')
          $missingFiles = @()
          foreach ($req in $required) {
            $ok = Test-Path (Join-Path $stage $req)
            Write-Host ("  {0,-24} {1}" -f $req, $(if ($ok) { 'OK' } else { 'MISSING' }))
            if (-not $ok) { $missingFiles += $req }
          }
          if ($missingFiles.Count -gt 0) { throw "required package files missing: $($missingFiles -join ', ')" }
          $zipPath = Join-Path $env:RUNNER_TEMP $zipName
          Compress-Archive -Path "$stage\*" -DestinationPath $zipPath -Force
          "zip_name=$zipName" >> $env:GITHUB_OUTPUT
          "zip_path=$zipPath" >> $env:GITHUB_OUTPUT
          Write-Host "Created $zipName"

      - name: Validate PE dependency closure (FAIL on debug CRT / missing DLLs)
        id: validate
        shell: pwsh
        run: |
          $stage = '${{ steps.pkg.outputs.stage }}'
          $report = Join-Path $env:RUNNER_TEMP "PE-VALIDATE-REPORT.json"
          python "$env:GITHUB_WORKSPACE\.github\scripts\pe_validate.py" "$stage" --json "$report"
          $rc = $LASTEXITCODE
          Write-Host "PE validation exit code: $rc"
          Get-Content "$report" | ForEach-Object { Write-Host $_ }
          if ($rc -ne 0) { throw "PE dependency-closure validation FAILED (see report above)" }
          Copy-Item "$report" (Join-Path $stage "PE-VALIDATE-REPORT.json") -Force

      - name: Compare package against official llama.cpp Windows CUDA release
        id: compare
        shell: pwsh
        run: |
          $stage = '${{ steps.pkg.outputs.stage }}'
          $officialDir = Join-Path $env:RUNNER_TEMP 'official-win'
          New-Item -ItemType Directory -Path $officialDir -Force | Out-Null
          $releases = & gh release list --repo ggml-org/llama.cpp --limit 30 --json tagName,assets 2>$null | ConvertFrom-Json
          $officialZip = $null
          $cudartZip = $null
          foreach ($r in $releases) {
            foreach ($a in $r.assets) {
              if ($a.name -like 'llama-*-bin-win-cuda-13.3-x64.zip' -and -not $officialZip) { $officialZip = $a }
              if ($a.name -like 'cudart-*-bin-win-cuda-13.3-x64.zip' -and -not $cudartZip) { $cudartZip = $a }
            }
            if ($officialZip -and $cudartZip) { break }
          }
          if (-not $officialZip) { throw "could not find official win-cuda-13.3-x64 release asset to compare against" }
          Write-Host "Comparing against official asset: $($officialZip.name)"
          & curl -sL -o (Join-Path $officialDir 'official-main.zip') $officialZip.browser_download_url
          $officialFiles = @()
          $z = [System.IO.Compression.ZipFile]::OpenRead((Join-Path $officialDir 'official-main.zip'))
          foreach ($e in $z.Entries) { if ($e.FullName -notlike '*/') { $officialFiles += [System.IO.Path]::GetFileName($e.FullName) } }
          $z.Dispose()
          if ($cudartZip) {
            Write-Host "Including official cudart asset: $($cudartZip.name)"
            & curl -sL -o (Join-Path $officialDir 'official-cudart.zip') $cudartZip.browser_download_url
            $z2 = [System.IO.Compression.ZipFile]::OpenRead((Join-Path $officialDir 'official-cudart.zip'))
            foreach ($e in $z2.Entries) { if ($e.FullName -notlike '*/') { $officialFiles += [System.IO.Path]::GetFileName($e.FullName) } }
            $z2.Dispose()
          }
          $officialFiles = @($officialFiles | Sort-Object -Unique)
          $ourFiles = @((Get-ChildItem $stage -File | Where-Object { $_.Extension -in '.exe','.dll' } | ForEach-Object { $_.Name }) | Sort-Object)
          $missing = @($officialFiles | Where-Object { $_ -notin $ourFiles })
          $extra   = @($ourFiles | Where-Object { $_ -notin $officialFiles })
          $cmp = [ordered]@{
            official_asset       = $officialZip.name
            official_file_count  = $officialFiles.Count
            custom_file_count    = $ourFiles.Count
            missing_from_custom  = $missing
            extra_in_custom      = $extra
            note                 = 'Official package ships every example tool and all CPU micro-architecture backends. Custom package ships the core runtime + CUDA + the CPU backends this build produces. Files in missing_from_custom are intentional omissions (extra example tools / CPU micro-arch backends) unless they are a core runtime dependency.'
          }
          $cmp | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $stage 'OFFICIAL-COMPARISON.json') -Encoding utf8
          Write-Host "OFFICIAL PACKAGE ($($officialFiles.Count) files): $($officialFiles -join ', ')"
          Write-Host ""
          Write-Host "CUSTOM PACKAGE ($($ourFiles.Count) files): $($ourFiles -join ', ')"
          Write-Host ""
          Write-Host "MISSING FROM CUSTOM ($($missing.Count)):"
          $missing | ForEach-Object { Write-Host "  - $_" }
          Write-Host ""
          Write-Host "EXTRA IN CUSTOM ($($extra.Count)):"
          $extra | ForEach-Object { Write-Host "  + $_" }
          $zipPath = '${{ steps.meta.outputs.zip_path }}'
          $zipName = '${{ steps.meta.outputs.zip_name }}'
          Compress-Archive -Path "$stage\*" -DestinationPath $zipPath -Force
          Write-Host "Re-created $zipName with validation reports included."

      - name: Validate ZIP structure
        shell: pwsh
        run: |
          $checkDir = Join-Path $env:RUNNER_TEMP "zipcheck-${env:VARIANT}"
          Expand-Archive -Path '${{ steps.meta.outputs.zip_path }}' -DestinationPath $checkDir -Force
          $must = @('llama-server.exe','llama-bench.exe','llama-server-impl.dll','ggml.dll','ggml-base.dll','ggml-cuda.dll','ggml-cpu-x64.dll','BUILD-METADATA.json','SHA256SUMS.txt','PE-VALIDATE-REPORT.json','OFFICIAL-COMPARISON.json')
          $missing = @()
          foreach ($m in $must) { if (-not (Test-Path (Join-Path $checkDir $m))) { $missing += $m } }
          if ($missing.Count -gt 0) { throw "ZIP missing required files: $($missing -join ', ')" }
          $null = Get-Content (Join-Path $checkDir 'BUILD-METADATA.json') -Raw | ConvertFrom-Json
          foreach ($line in (Get-Content (Join-Path $checkDir 'SHA256SUMS.txt'))) {
            $parts = $line -split '\s+'
            if ($parts.Count -lt 2) { continue }
            $actual = (Get-FileHash (Join-Path $checkDir $parts[1]) -Algorithm SHA256).Hash.ToLower()
            if ($actual -ne $parts[0]) { throw "hash mismatch for $($parts[1]): $actual != $($parts[0])" }
          }
          Write-Host "ZIP validation OK: $($must -join ', ')"

      - name: Query executable version metadata
        shell: pwsh
        run: |
          $checkDir = Join-Path $env:RUNNER_TEMP "zipcheck-${env:VARIANT}"
          foreach ($exe in @('llama-server.exe','llama-bench.exe')) {
            $p = Join-Path $checkDir $exe
            $v = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($p)
            Write-Host "${exe}: ProductName=$($v.ProductName) ProductVersion=$($v.ProductVersion) FileVersion=$($v.FileVersion)"
          }
          Write-Host "NOTE: CUDA initialization not attempted (no GPU on runner)."

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.zip_name }}
          path: ${{ steps.meta.outputs.zip_path }}
          retention-days: 14


  build-tma:
    if: inputs.variant == 'all' || inputs.variant == 'tma'
    runs-on: windows-2022
    name: build (tma, cuda13.3, sm120a)
    env:
      VARIANT: tma
    steps:
      - name: Map variant to source branch
        id: map
        shell: pwsh
        run: |
          switch ($env:VARIANT) {
            'stock'   { $b = 'master' }
            'tma'     { $b = 'blackwell/tma' }
            'cutlass' { $b = 'blackwell/cutlass' }
            default   { throw "unknown variant $env:VARIANT" }
          }
          "branch=$b" >> $env:GITHUB_OUTPUT
          Write-Host "variant=$env:VARIANT branch=$b"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: brx19/llama.cpp
          ref: ${{ steps.map.outputs.branch }}
          fetch-depth: 20

      - name: Record source provenance
        id: src
        shell: pwsh
        run: |
          $sha  = (git rev-parse HEAD).Trim()
          $short = $sha.Substring(0,10)
          $base = (git ls-remote origin refs/heads/master | ForEach-Object { ($_ -split '\t')[0] }).Trim()
          if (-not $base) { $base = $sha }
          "sha=$sha" >> $env:GITHUB_OUTPUT
          "short_sha=$short" >> $env:GITHUB_OUTPUT
          "branch=${{ steps.map.outputs.branch }}" >> $env:GITHUB_OUTPUT
          "base_sha=$base" >> $env:GITHUB_OUTPUT
          Write-Host "source_sha=$sha base_sha=$base"

      - name: Install Cuda Toolkit 13.3
        uses: ./.github/actions/windows-setup-cuda
        with:
          cuda_version: ${{ env.CUDA_VERSION }}
          cuda_arch: ${{ env.CUDA_PKG }}

      - name: Install Ninja
        shell: pwsh
        run: choco install ninja -y

      - name: Record toolchain versions
        id: toolchain
        shell: pwsh
        run: |
          $vcvars = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat"
          if (-not (Test-Path $vcvars)) {
            $vcvars = "C:\Program Files\Microsoft Visual Studio\2022\Community\VC\Auxiliary\Build\vcvarsall.bat"
          }
          # cl with no args prints usage to stderr; cl /? prints full help
          # (including the version banner) to stdout reliably.
          $clOut = (& cmd /c "`"$vcvars`" x64 >nul 2>&1 && cl /? 2>&1") -join "`n"
          $m = [regex]::Match($clOut, 'Version\s+(\d+\.\d+\.\d+(?:\.\d+)?)')
          if (-not $m.Success) { throw "MSVC version detection FAILED: cl /? output was:`n$clOut" }
          "msvc_version=$($m.Groups[1].Value)" >> $env:GITHUB_OUTPUT
          $nvccOut = & "$env:CUDA_PATH\bin\nvcc.exe" --version 2>&1
          $m = [regex]::Match(($nvccOut -join "`n"), 'release (\d+\.\d+)')
          if (-not $m.Success) { throw "CUDA version detection FAILED: nvcc output was:`n$nvccOut" }
          "cuda_version=$($m.Groups[1].Value)" >> $env:GITHUB_OUTPUT
          $cmOut = & cmake --version
          $m = [regex]::Match(($cmOut -join "`n"), 'version (\d+\.\d+\.\d+)')
          if (-not $m.Success) { throw "CMake version detection FAILED: `n$cmOut" }
          "cmake_version=$($m.Groups[1].Value)" >> $env:GITHUB_OUTPUT
          $ninjaOut = & ninja --version
          if (-not $ninjaOut) { throw "Ninja version detection FAILED" }
          "ninja_version=$($ninjaOut.Trim())" >> $env:GITHUB_OUTPUT
          Write-Host "toolchain: msvc=$($m.Groups[1].Value) cuda=$(Get-Content $env:GITHUB_OUTPUT | Select-String '^cuda_version' | ForEach-Object { ($_ -split '=')[1] })"

      - name: Configure (multi-config, Release selected at build time)
        id: configure
        shell: pwsh
        run: |
          $cmakeArgs = @('-DGGML_CUDA=ON','-DGGML_BACKEND_DL=ON','-DGGML_NATIVE=OFF')
          # CRITICAL: explicitly set the MSVC compilers so CMake/Ninja does not
          # fall back to a bare cl on the runner's default PATH (which lacks the
          # vcvars include/lib environment and fails with C1083 stdbool.h).
          $cmakeArgs += '-DCMAKE_C_COMPILER=cl'
          $cmakeArgs += '-DCMAKE_CXX_COMPILER=cl'
          $cmakeArgs += '-DCMAKE_BUILD_TYPE=Release'
          $cmakeArgs | Out-File -FilePath $env:RUNNER_TEMP/cmake_args.txt -Encoding utf8
          Write-Host "CMake args: $($cmakeArgs -join ' ')"
          $vcvars = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat"
          if (-not (Test-Path $vcvars)) {
            $vcvars = "C:\Program Files\Microsoft Visual Studio\2022\Community\VC\Auxiliary\Build\vcvarsall.bat"
          }
          $envDump = & cmd /c "`"$vcvars`" x64 >nul && set"
          foreach ($line in $envDump) {
            if ($line -match '^([A-Za-z_][A-Za-z0-9_]*)=(.*)$') {
              [Environment]::SetEnvironmentVariable($Matches[1], $Matches[2], 'Process')
            }
          }
          Write-Host "MSVC env exported. cl.exe on PATH: $(if (Get-Command cl -ErrorAction SilentlyContinue) { 'yes' } else { 'NO' })"
          & cmake -S . -B build -G `Ninja Multi-Config` $($cmakeArgs -join ' ') 2>&1 | Tee-Object -FilePath $env:RUNNER_TEMP/configure.log
          if ($LASTEXITCODE -ne 0) { throw "cmake configure failed (exit $LASTEXITCODE)" }

      - name: Build (Release, explicit --config)
        id: build
        shell: pwsh
        run: |
          $jobs = [Environment]::ProcessorCount
          & cmake --build build --config Release -j $jobs 2>&1 | Tee-Object -FilePath $env:RUNNER_TEMP/build.log
          if ($LASTEXITCODE -ne 0) { throw "cmake build failed (exit $LASTEXITCODE)" }
          $binDir = "build\bin"
          if (-not (Test-Path (Join-Path $binDir "llama-server.exe"))) { $binDir = "build\bin\Release" }
          foreach ($exe in @('llama-server.exe','llama-bench.exe')) {
            if (-not (Test-Path (Join-Path $binDir $exe))) { throw "build did not produce $exe in $binDir" }
          }
          foreach ($exe in @('llama-server.exe','llama-bench.exe')) {
            $blob = [System.IO.File]::ReadAllBytes((Join-Path $binDir $exe))
            $text = [System.Text.Encoding]::ASCII.GetString($blob)
            if ($text.Contains('VCRUNTIME140D.dll') -or $text.Contains('ucrtbased.dll')) {
              throw "$exe is a DEBUG build (imports debug CRT). The build must be Release."
            }
          }
          "bin_dir=$binDir" >> $env:GITHUB_OUTPUT
          Write-Host "Build OK (Release). bin dir: $binDir"

      - name: Collect runtime package (Release only, explicit file list)
        id: pkg
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "package-$env:VARIANT"
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          $binDir = '${{ steps.build.outputs.bin_dir }}'
          $buildExes = Get-ChildItem "$binDir\*.exe" | ForEach-Object { $_.Name }
          $buildDlls = Get-ChildItem "$binDir\*.dll" | Where-Object { $_.Name -like 'ggml*.dll' -or $_.Name -like 'llama*.dll' -or $_.Name -like 'mtmd*.dll' -or $_.Name -like 'libomp*.dll' } | ForEach-Object { $_.Name }
          Write-Host "Build binaries from $binDir:"
          $buildExes | ForEach-Object { Write-Host "  exe  $_" }
          $buildDlls | ForEach-Object { Write-Host "  dll  $_" }
          foreach ($name in ($buildExes + $buildDlls)) {
            Copy-Item (Join-Path $binDir $name) $stage -ErrorAction Stop
          }
          $cudaDir = $env:CUDA_PATH
          if (-not $cudaDir) { throw "CUDA_PATH is not set; cannot stage CUDA runtime DLLs" }
          $cudaComponents = @('cudart','libcublas','libnvvm','cuda_nvrtc','cuda_nvtx','cuda_profiler_api','visual_studio_integration','cccl')
          $stagedCuda = @()
          foreach ($d in $cudaComponents) {
            $dir = Join-Path $cudaDir $d
            if (Test-Path $dir) {
              Get-ChildItem $dir -Filter *.dll | ForEach-Object {
                Copy-Item $_.FullName $stage -Force
                $stagedCuda += $_.Name
              }
            }
          }
          Get-ChildItem "$cudaDir\bin" -Filter 'cublasLt*.dll' | ForEach-Object {
            Copy-Item $_.FullName $stage -Force
            $stagedCuda += $_.Name
          }
          Get-ChildItem "$cudaDir\bin" -Filter 'nvvm*.dll' | ForEach-Object {
            Copy-Item $_.FullName $stage -Force
            $stagedCuda += $_.Name
          }
          Write-Host "CUDA runtime DLLs staged from $cudaDir:"
          $stagedCuda | ForEach-Object { Write-Host "  cuda $_" }
          $allCuda = (Get-ChildItem $stage -Filter *.dll).Name
          if (-not ($allCuda | Where-Object { $_ -like 'cudart*' -or $_ -like 'nvcudart*' })) {
            throw "no cudart DLL staged; the package would not run standalone"
          }
          if (-not ($allCuda | Where-Object { $_ -like 'cublas*' })) {
            throw "no cublas DLL staged; the package would not run standalone"
          }
          Write-Host "Package contents:"
          Get-ChildItem $stage | ForEach-Object { Write-Host ("  {0,-28} {1,12:N0} bytes" -f $_.Name, $_.Length) }
          "stage=$stage" >> $env:GITHUB_OUTPUT
          "cuda_dlls=$($stagedCuda -join ';')" >> $env:GITHUB_OUTPUT

      - name: Build metadata + SHA256 (complete provenance, no empty fields)
        id: meta
        shell: pwsh
        run: |
          $stage       = '${{ steps.pkg.outputs.stage }}'
          $variant     = $env:VARIANT
          $cudaVersion = '${{ steps.toolchain.outputs.cuda_version }}'
          $shortSha    = '${{ steps.src.outputs.short_sha }}'
          $zipName     = "llama-win-cuda${cudaVersion}-sm120a-${variant}-${shortSha}.zip"
          $cutlassEnabled = ($variant -eq 'cutlass')
          $cutlassRev = 'n/a'
          if ($cutlassEnabled) {
            $cmakeContent = Get-Content ggml/src/ggml-cuda/CMakeLists.txt -Raw
            $m = [regex]::Match($cmakeContent, '(CUTLASS|cutlass)[^\r\n]*(?:GIT_TAG|URL)[^\r\n]*?([v\d][\w./-]*)')
            if ($m.Success) { $cutlassRev = $m.Groups[2].Value } else { $cutlassRev = 'see ggml/src/ggml-cuda/CMakeLists.txt' }
          }
          $metadata = [ordered]@{
            variant                 = $variant
            build_timestamp         = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            source_branch           = '${{ steps.src.outputs.branch }}'
            source_sha              = '${{ steps.src.outputs.sha }}'
            source_short_sha        = $shortSha
            upstream_base_sha       = '${{ steps.src.outputs.base_sha }}'
            original_pr_sha         = switch ($variant) { 'tma' { '10247a1a207746b92050c7cbb6855f45f8242c9f (PR #28572 head)' } 'cutlass' { '94ee2c759734c697ecaa0cb05058cda4f46b42e3 (PR #26704 head)' } default { 'n/a (stock = upstream master)' } }
            github_actions_run_id   = $env:GITHUB_RUN_ID
            github_runner_image     = $env:RUNNER_IMAGE
            msvc_version            = '${{ steps.toolchain.outputs.msvc_version }}'
            cuda_version            = $cudaVersion
            cuda_component_versions = (Get-Content $env:RUNNER_TEMP/cuda_packages.json -Raw | ConvertFrom-Json)
            cmake_version           = '${{ steps.toolchain.outputs.cmake_version }}'
            ninja_version           = '${{ steps.toolchain.outputs.ninja_version }}'
            cmake_arguments         = (Get-Content $env:RUNNER_TEMP/cmake_args.txt)
            cuda_architecture       = '120a-real'
            build_configuration     = 'Release'
            cutlass_enabled         = $cutlassEnabled
            cutlass_revision        = $cutlassRev
            target_gpu              = 'NVIDIA GeForce RTX 5090 (Blackwell, SM120)'
            gpu_validation          = 'REQUIRES LOCAL RTX 5090 VALIDATION - GPU runtime NOT verified on the CI runner'
          }
          $requiredFields = @('variant','source_sha','upstream_base_sha','msvc_version','cuda_version','cmake_version','ninja_version','cuda_architecture','build_configuration')
          $missing = @()
          foreach ($k in $requiredFields) {
            $val = $metadata[$k]
            if ([string]::IsNullOrWhiteSpace([string]$val)) { $missing += $k }
          }
          if ($missing.Count -gt 0) { throw "BUILD-METADATA provenance fields empty/missing: $($missing -join ', ')" }
          if ($metadata.build_configuration -ne 'Release') { throw "build_configuration is $($metadata.build_configuration), expected Release" }
          $metadata | ConvertTo-Json -Depth 5 | Set-Content "$stage\BUILD-METADATA.json" -Encoding utf8
          Push-Location $stage
          $lines = @()
          foreach ($f in (Get-ChildItem -File | Where-Object { $_.Extension -in '.exe','.dll' } | Sort-Object Name)) {
            $h = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
            $lines += ("{0}  {1}" -f $h, $f.Name)
          }
          $lines | Set-Content 'SHA256SUMS.txt' -Encoding utf8
          Pop-Location
          Write-Host "Metadata + SHA256 written. Required-file check:"
          $required = @('llama-server.exe','llama-bench.exe','llama-server-impl.dll','ggml.dll','ggml-base.dll','ggml-cuda.dll','ggml-cpu-x64.dll','BUILD-METADATA.json','SHA256SUMS.txt')
          $missingFiles = @()
          foreach ($req in $required) {
            $ok = Test-Path (Join-Path $stage $req)
            Write-Host ("  {0,-24} {1}" -f $req, $(if ($ok) { 'OK' } else { 'MISSING' }))
            if (-not $ok) { $missingFiles += $req }
          }
          if ($missingFiles.Count -gt 0) { throw "required package files missing: $($missingFiles -join ', ')" }
          $zipPath = Join-Path $env:RUNNER_TEMP $zipName
          Compress-Archive -Path "$stage\*" -DestinationPath $zipPath -Force
          "zip_name=$zipName" >> $env:GITHUB_OUTPUT
          "zip_path=$zipPath" >> $env:GITHUB_OUTPUT
          Write-Host "Created $zipName"

      - name: Validate PE dependency closure (FAIL on debug CRT / missing DLLs)
        id: validate
        shell: pwsh
        run: |
          $stage = '${{ steps.pkg.outputs.stage }}'
          $report = Join-Path $env:RUNNER_TEMP "PE-VALIDATE-REPORT.json"
          python "$env:GITHUB_WORKSPACE\.github\scripts\pe_validate.py" "$stage" --json "$report"
          $rc = $LASTEXITCODE
          Write-Host "PE validation exit code: $rc"
          Get-Content "$report" | ForEach-Object { Write-Host $_ }
          if ($rc -ne 0) { throw "PE dependency-closure validation FAILED (see report above)" }
          Copy-Item "$report" (Join-Path $stage "PE-VALIDATE-REPORT.json") -Force

      - name: Compare package against official llama.cpp Windows CUDA release
        id: compare
        shell: pwsh
        run: |
          $stage = '${{ steps.pkg.outputs.stage }}'
          $officialDir = Join-Path $env:RUNNER_TEMP 'official-win'
          New-Item -ItemType Directory -Path $officialDir -Force | Out-Null
          $releases = & gh release list --repo ggml-org/llama.cpp --limit 30 --json tagName,assets 2>$null | ConvertFrom-Json
          $officialZip = $null
          $cudartZip = $null
          foreach ($r in $releases) {
            foreach ($a in $r.assets) {
              if ($a.name -like 'llama-*-bin-win-cuda-13.3-x64.zip' -and -not $officialZip) { $officialZip = $a }
              if ($a.name -like 'cudart-*-bin-win-cuda-13.3-x64.zip' -and -not $cudartZip) { $cudartZip = $a }
            }
            if ($officialZip -and $cudartZip) { break }
          }
          if (-not $officialZip) { throw "could not find official win-cuda-13.3-x64 release asset to compare against" }
          Write-Host "Comparing against official asset: $($officialZip.name)"
          & curl -sL -o (Join-Path $officialDir 'official-main.zip') $officialZip.browser_download_url
          $officialFiles = @()
          $z = [System.IO.Compression.ZipFile]::OpenRead((Join-Path $officialDir 'official-main.zip'))
          foreach ($e in $z.Entries) { if ($e.FullName -notlike '*/') { $officialFiles += [System.IO.Path]::GetFileName($e.FullName) } }
          $z.Dispose()
          if ($cudartZip) {
            Write-Host "Including official cudart asset: $($cudartZip.name)"
            & curl -sL -o (Join-Path $officialDir 'official-cudart.zip') $cudartZip.browser_download_url
            $z2 = [System.IO.Compression.ZipFile]::OpenRead((Join-Path $officialDir 'official-cudart.zip'))
            foreach ($e in $z2.Entries) { if ($e.FullName -notlike '*/') { $officialFiles += [System.IO.Path]::GetFileName($e.FullName) } }
            $z2.Dispose()
          }
          $officialFiles = @($officialFiles | Sort-Object -Unique)
          $ourFiles = @((Get-ChildItem $stage -File | Where-Object { $_.Extension -in '.exe','.dll' } | ForEach-Object { $_.Name }) | Sort-Object)
          $missing = @($officialFiles | Where-Object { $_ -notin $ourFiles })
          $extra   = @($ourFiles | Where-Object { $_ -notin $officialFiles })
          $cmp = [ordered]@{
            official_asset       = $officialZip.name
            official_file_count  = $officialFiles.Count
            custom_file_count    = $ourFiles.Count
            missing_from_custom  = $missing
            extra_in_custom      = $extra
            note                 = 'Official package ships every example tool and all CPU micro-architecture backends. Custom package ships the core runtime + CUDA + the CPU backends this build produces. Files in missing_from_custom are intentional omissions (extra example tools / CPU micro-arch backends) unless they are a core runtime dependency.'
          }
          $cmp | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $stage 'OFFICIAL-COMPARISON.json') -Encoding utf8
          Write-Host "OFFICIAL PACKAGE ($($officialFiles.Count) files): $($officialFiles -join ', ')"
          Write-Host ""
          Write-Host "CUSTOM PACKAGE ($($ourFiles.Count) files): $($ourFiles -join ', ')"
          Write-Host ""
          Write-Host "MISSING FROM CUSTOM ($($missing.Count)):"
          $missing | ForEach-Object { Write-Host "  - $_" }
          Write-Host ""
          Write-Host "EXTRA IN CUSTOM ($($extra.Count)):"
          $extra | ForEach-Object { Write-Host "  + $_" }
          $zipPath = '${{ steps.meta.outputs.zip_path }}'
          $zipName = '${{ steps.meta.outputs.zip_name }}'
          Compress-Archive -Path "$stage\*" -DestinationPath $zipPath -Force
          Write-Host "Re-created $zipName with validation reports included."

      - name: Validate ZIP structure
        shell: pwsh
        run: |
          $checkDir = Join-Path $env:RUNNER_TEMP "zipcheck-${env:VARIANT}"
          Expand-Archive -Path '${{ steps.meta.outputs.zip_path }}' -DestinationPath $checkDir -Force
          $must = @('llama-server.exe','llama-bench.exe','llama-server-impl.dll','ggml.dll','ggml-base.dll','ggml-cuda.dll','ggml-cpu-x64.dll','BUILD-METADATA.json','SHA256SUMS.txt','PE-VALIDATE-REPORT.json','OFFICIAL-COMPARISON.json')
          $missing = @()
          foreach ($m in $must) { if (-not (Test-Path (Join-Path $checkDir $m))) { $missing += $m } }
          if ($missing.Count -gt 0) { throw "ZIP missing required files: $($missing -join ', ')" }
          $null = Get-Content (Join-Path $checkDir 'BUILD-METADATA.json') -Raw | ConvertFrom-Json
          foreach ($line in (Get-Content (Join-Path $checkDir 'SHA256SUMS.txt'))) {
            $parts = $line -split '\s+'
            if ($parts.Count -lt 2) { continue }
            $actual = (Get-FileHash (Join-Path $checkDir $parts[1]) -Algorithm SHA256).Hash.ToLower()
            if ($actual -ne $parts[0]) { throw "hash mismatch for $($parts[1]): $actual != $($parts[0])" }
          }
          Write-Host "ZIP validation OK: $($must -join ', ')"

      - name: Query executable version metadata
        shell: pwsh
        run: |
          $checkDir = Join-Path $env:RUNNER_TEMP "zipcheck-${env:VARIANT}"
          foreach ($exe in @('llama-server.exe','llama-bench.exe')) {
            $p = Join-Path $checkDir $exe
            $v = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($p)
            Write-Host "${exe}: ProductName=$($v.ProductName) ProductVersion=$($v.ProductVersion) FileVersion=$($v.FileVersion)"
          }
          Write-Host "NOTE: CUDA initialization not attempted (no GPU on runner)."

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.zip_name }}
          path: ${{ steps.meta.outputs.zip_path }}
          retention-days: 14

  # ------------------------------------------------------ publish release
  publish-release:
    if: inputs.publish_release == true && (needs.build-stock.result == 'success' || needs.build-tma.result == 'success' || needs.build-cutlass.result == 'success')
    needs: [build-stock, build-tma, build-cutlass]
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download all variant artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: llama-win-cuda*-sm120a-*.zip
          merge-multiple: true
      - name: Create release with assets
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: brx19/llama.cpp
        run: |
          $date = (Get-Date).ToUniversalTime().ToString('yyyyMMdd')
          try {
            $upstreamShort = (git ls-remote https://github.com/ggml-org/llama.cpp refs/heads/master | ForEach-Object { ($_ -split '\t')[0].Substring(0,10) }).Trim()
          } catch { $upstreamShort = 'unknown' }
          if (-not $upstreamShort) { $upstreamShort = 'unknown' }
          $tag = "blackwell-build-${date}-${upstreamShort}"
          $assets = @(Get-ChildItem dist -Filter *.zip | ForEach-Object { $_.FullName })
          if ($assets.Count -eq 0) { throw "no variant ZIPs found to publish" }
          $notes = @"
          Blackwell (RTX 5090 / SM120a) native Windows x64 CUDA builds.

          Assets:
          $(($assets | ForEach-Object { '  - ' + (Split-Path $_ -Leaf) }) -join "`n")

          GPU runtime validation: NOT performed on CI. REQUIRES LOCAL RTX 5090 VALIDATION.
          Each ZIP contains BUILD-METADATA.json (source SHA, CUDA/MSVC/CMake versions, CMake args, build_configuration=Release), SHA256SUMS.txt, PE-VALIDATE-REPORT.json, and OFFICIAL-COMPARISON.json.
          "@
          gh release delete "$tag" --yes --cleanup-tag 2>$null
          gh release create "$tag" $assets --title "Blackwell Windows builds ($date)" --notes $notes
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed (exit $LASTEXITCODE)" }
          Write-Host "Published release $tag with $($assets.Count) assets"
