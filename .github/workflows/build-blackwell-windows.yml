# Blackwell (RTX 5090 / SM120a) native Windows x64 CUDA build workflow
#
# Builds llama.cpp on GitHub-hosted Windows runners for the NVIDIA RTX 5090
# (Blackwell, compute capability 12.0). No GPU is required on the runner —
# CUDA device code is cross-compiled for 120a-real.
#
# Variants:
#   stock     - current upstream/master as the performance baseline
#   tma       - blackwell/tma branch (cp.async/TMA NVFP4 MMQ pipeline, PR #28572)
#   cutlass   - blackwell/cutlass branch (CUTLASS SM120 MoE prefill, PR #26704)
#   all       - every valid variant (stock, tma, cutlass)
#
# Combined variant is intentionally NOT supported: the TMA kernel and the
# CUTLASS repack path are mutually exclusive at runtime for NVFP4
# (see BLACKWELL-BUILD.md, section "Combined variant").
#
# Long-term storage: GitHub Releases (see "Publish release" job).
# Convenience: short-lived Actions artifacts.
#
# NOTE: GPU runtime validation is NOT performed here (no RTX 5090 on the
# runner). All ZIPs are marked REQUIRES LOCAL RTX 5090 VALIDATION.

name: CI (Blackwell, windows)

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Build variant: stock | tma | cutlass | all"
        type: choice
        default: all
        options:
          - stock
          - tma
          - cutlass
          - all
      publish_release:
        description: "Publish successful builds to a GitHub Release"
        type: boolean
        default: false

env:
  CUDA_VERSION: "13.3"
  CUDA_PKG: x64

permissions:
  contents: write
  actions: write

jobs:
  # Expand the requested variant list into a matrix. 'combined' is never built.
  expand:
    runs-on: windows-2022
    outputs:
      variants: ${{ steps.expand.outputs.variants }}
    steps:
      - id: expand
        shell: pwsh
        run: |
          $v = '${{ inputs.variant }}'
          if ($v -eq 'all') { $list = @('stock','tma','cutlass') } else { $list = @($v) }
          $json = ('[' + (($list | ForEach-Object { '"$_"' }) -join ',') + ']')
          "variants=$json" >> $env:GITHUB_OUTPUT
          Write-Host "Building variants: $json"

  build:
    needs: expand
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJson(needs.expand.outputs.variants) }}
    name: build (${{ matrix.variant }}, cuda13.3, sm120a)
    env:
      VARIANT: "${{ matrix.variant }}"
    steps:
      - name: Map variant to source branch
        id: map
        shell: pwsh
        run: |
          switch ('$env:VARIANT') {
            'stock'   { $b = 'master' }
            'tma'     { $b = 'blackwell/tma' }
            'cutlass' { $b = 'blackwell/cutlass' }
            default   { throw "unknown variant $env:VARIANT" }
          }
          "branch=$b" >> $env:GITHUB_OUTPUT
          Write-Host "variant=$env:VARIANT branch=$b"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          repository: brx19/llama.cpp
          ref: ${{ steps.map.outputs.branch }}
          fetch-depth: 20

      - name: Record source provenance
        id: src
        shell: pwsh
        run: |
          $sha  = (git rev-parse HEAD).Trim()
          $short = $sha.Substring(0,10)
          # upstream base = fork master HEAD (master is the clean upstream mirror)
          $base = (git ls-remote origin refs/heads/master | ForEach-Object { ($_ -split '	')[0] }).Trim()
          if (-not $base) { $base = $sha }
          "sha=$sha" >> $env:GITHUB_OUTPUT
          "short_sha=$short" >> $env:GITHUB_OUTPUT
          "branch=${{ steps.map.outputs.branch }}" >> $env:GITHUB_OUTPUT
          "base_sha=$base" >> $env:GITHUB_OUTPUT
          Write-Host "source_sha=$sha base_sha=$base"

      - name: Install Cuda Toolkit 13.3
        uses: ./.github/actions/windows-setup-cuda
        with:
          cuda_version: ${{ env.CUDA_VERSION }}
          cuda_arch: ${{ env.CUDA_PKG }}

      - name: Install Ninja
        shell: pwsh
        run: choco install ninja -y

      - name: Record toolchain versions
        id: toolchain
        shell: pwsh
        run: |
          # vcvarsall for x64 (cl.exe / nvcc.exe environment)
          & cmd /c "`"C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat`" x64 >nul && cl" 2>&1 | Select-String 'Version (\d+\.\d+\.\d+\.\d+)' | ForEach-Object {
            "msvc_version=$($_.Matches[0].Groups[1].Value)" >> $env:GITHUB_OUTPUT
          }
          $nvccOut = & "$env:CUDA_PATH\bin\nvcc.exe" --version 2>&1
          $m = [regex]::Match(($nvccOut -join "`n"), 'release (\d+\.\d+)')
          "cuda_version=$($m.Groups[1].Value)" >> $env:GITHUB_OUTPUT
          "cmake_version=$((cmake --version | Select-String 'version (\d+\.\d+\.\d+)').Matches[0].Groups[1].Value)" >> $env:GITHUB_OUTPUT
          "ninja_version=$((ninja --version).Trim())" >> $env:GITHUB_OUTPUT
          Write-Host "toolchain recorded: msvc=$(Get-Content $env:GITHUB_OUTPUT | Select-String msvc) cuda=$(Get-Content $env:GITHUB_OUTPUT | Select-String cuda_version)"

      - name: Configure (Release, SM120a)
        id: configure
        shell: pwsh
        run: |
          $cutlassFlag = if ($env:VARIANT -eq 'cutlass') { '-DGGML_CUDA_CUTLASS=ON' } else { $null }
          $cmakeArgs = @('-DGGML_CUDA=ON','-DGGML_BACKEND_DL=ON','-DGGML_NATIVE=OFF','-DCMAKE_CUDA_ARCHITECTURES=120a-real')
          if ($cutlassFlag) { $cmakeArgs += $cutlassFlag }
          $cmakeArgs | Out-File -FilePath $env:RUNNER_TEMP/cmake_args.txt -Encoding utf8
          Write-Host "CMake args: $($cmakeArgs -join ' ')"
          $env:VCVARS = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat"
          & cmd /c "`"$env:VCVARS`" x64 >nul && cmake -S . -B build -G `Ninja Multi-Config` -DCMAKE_BUILD_TYPE=Release $($cmakeArgs -join ' ')" 2>&1 | Tee-Object -FilePath $env:RUNNER_TEMP/configure.log
          if ($LASTEXITCODE -ne 0) { throw "cmake configure failed (exit $LASTEXITCODE)" }

      - name: Verify SM120a architecture target
        shell: pwsh
        run: |
          $log = Get-Content $env:RUNNER_TEMP/configure.log -Raw
          $found = [regex]::Matches($log, 'Using CMAKE_CUDA_ARCHITECTURES=([^\r\n]+)') | Select-Object -First 1
          if ($found) {
            Write-Host "CMake arch resolution: $($found.Groups[1].Value)"
            if ($found.Groups[1].Value -notmatch '120a-real') {
              throw "expected CMAKE_CUDA_ARCHITECTURES to contain 120a-real, got: $($found.Groups[1].Value)"
            }
            Write-Host "OK: build targets SM120a (120a-real)"
          } else {
            throw "could not find 'Using CMAKE_CUDA_ARCHITECTURES=' in configure log — cannot verify SM120a target"
          }

      - name: Build
        shell: pwsh
        run: |
          $jobs = [Math]::Max(1, [Environment]::ProcessorCount - 1)
          & cmd /c "`"C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat`" x64 >nul && cmake --build build --config Release -j $jobs" 2>&1 | Tee-Object -FilePath $env:RUNNER_TEMP/build.log
          if ($LASTEXITCODE -ne 0) { throw "cmake build failed (exit $LASTEXITCODE)" }
          # Evidence that device code was compiled for sm_120a
          $proof = Select-String -Path $env:RUNNER_TEMP/build.log -Pattern 'sm_120a|120a' | Select-Object -First 5
          if ($proof) { $proof | ForEach-Object { Write-Host "ARCH-PROOF: $($_.Line)" } } else {
            Write-Host "WARNING: no sm_120a evidence in build log. CMake arch verification above is authoritative."
          }

      - name: Record CUDA component versions
        id: cuda_pkgs
        shell: pwsh
        run: |
          $cudaDir = $env:CUDA_PATH
          $pkgs = @{}
          foreach ($d in Get-ChildItem -Path $cudaDir -Directory -ErrorAction SilentlyContinue) {
            $dll = Get-ChildItem -Path $d.FullName -Filter *.dll -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($dll) {
              try { $v = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($dll.FullName).FileVersion } catch { $v = 'unknown' }
              $pkgs[$d.Name] = $v
            }
          }
          $cublas = Get-ChildItem -Path "$cudaDir\libcublas" -Filter *.dll -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($cublas) { $pkgs['libcublas'] = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($cublas.FullName).FileVersion }
          $pkgs | ConvertTo-Json -Compress | Set-Content -Path $env:RUNNER_TEMP/cuda_packages.json -Encoding utf8
          Write-Host "CUDA component versions: $(Get-Content $env:RUNNER_TEMP/cuda_packages.json)"

      - name: Collect runtime package
        id: pkg
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "package-$env:VARIANT"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          $binDir = "build\bin\Release"
          foreach ($exe in @('llama-server.exe','llama-bench.exe')) {
            Copy-Item "$binDir\$exe" $stage -ErrorAction Stop
          }
          # ggml DLLs (names vary across releases; take all that exist)
          Get-ChildItem "$binDir\ggml*.dll" -ErrorAction SilentlyContinue | ForEach-Object { Copy-Item $_.FullName $stage }
          # CUDA runtime DLLs required to load the backends
          $cudaDir = $env:CUDA_PATH
          foreach ($d in @('cudart','libcublas','libnvvm','cuda_nvtx','cuda_profiler_api','visual_studio_integration','cccl')) {
            $dir = Join-Path $cudaDir $d
            if (Test-Path $dir) {
              Get-ChildItem $dir -Filter *.dll -ErrorAction SilentlyContinue | ForEach-Object { Copy-Item $_.FullName $stage -Force }
            }
          }
          Get-ChildItem "$cudaDir\bin" -Filter 'cublasLt*.dll' -ErrorAction SilentlyContinue | ForEach-Object { Copy-Item $_.FullName $stage -Force }
          Write-Host "Package contents:"
          Get-ChildItem $stage | ForEach-Object { Write-Host ("  {0,-24} {1,10:N0} bytes" -f $_.Name, $_.Length) }
          "stage=$stage" >> $env:GITHUB_OUTPUT

      - name: Build metadata + SHA256
        id: meta
        shell: pwsh
        run: |
          $stage      = '${{ steps.pkg.outputs.stage }}'
          $variant    = $env:VARIANT
          $cudaVersion = '${{ steps.toolchain.outputs.cuda_version }}'
          $shortSha   = '${{ steps.src.outputs.short_sha }}'
          $date       = (Get-Date).ToUniversalTime().ToString('yyyyMMdd')
          $zipName    = "llama-win-cuda${cudaVersion}-sm120a-${variant}-${shortSha}.zip"
          $cutlassEnabled = ($variant -eq 'cutlass')
          $cutlassRev = 'n/a'
          if ($cutlassEnabled) {
            $cmakeContent = Get-Content ggml/src/ggml-cuda/CMakeLists.txt -Raw
            $m = [regex]::Match($cmakeContent, '(CUTLASS|cutlass)[^\r\n]*(?:GIT_TAG|URL)[^\r\n]*?([v\d][\w./-]*)')
            if ($m.Success) { $cutlassRev = $m.Groups[2].Value } else { $cutlassRev = 'see ggml/src/ggml-cuda/CMakeLists.txt' }
          }
          $metadata = [ordered]@{
            variant                 = $variant
            build_timestamp         = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            source_branch           = '${{ steps.src.outputs.branch }}'
            source_sha              = '${{ steps.src.outputs.sha }}'
            source_short_sha        = $shortSha
            upstream_base_sha       = '${{ steps.src.outputs.base_sha }}'
            original_pr_sha         = switch ($variant) { 'tma' { '10247a1a207746b92050c7cbb6855f45f8242c9f (PR #28572 head)' } 'cutlass' { '94ee2c759734c697ecaa0cb05058cda4f46b42e3 (PR #26704 head)' } default { 'n/a (stock = upstream master)' } }
            github_actions_run_id   = $env:GITHUB_RUN_ID
            github_runner_image     = $env:RUNNER_IMAGE
            msvc_version            = '${{ steps.toolchain.outputs.msvc_version }}'
            cuda_version            = $cudaVersion
            cuda_component_versions = (Get-Content $env:RUNNER_TEMP/cuda_packages.json -Raw | ConvertFrom-Json)
            cmake_version           = '${{ steps.toolchain.outputs.cmake_version }}'
            ninja_version           = '${{ steps.toolchain.outputs.ninja_version }}'
            cmake_arguments         = (Get-Content $env:RUNNER_TEMP/cmake_args.txt)
            cuda_architecture       = '120a-real'
            cutlass_enabled         = $cutlassEnabled
            cutlass_revision        = $cutlassRev
            target_gpu              = 'NVIDIA GeForce RTX 5090 (Blackwell, SM120)'
            gpu_validation          = 'REQUIRES LOCAL RTX 5090 VALIDATION - GPU runtime NOT verified on the CI runner'
          }
          $metadata | ConvertTo-Json -Depth 5 | Set-Content "$stage\BUILD-METADATA.json" -Encoding utf8
          # SHA256SUMS over all packaged binaries/DLLs (generated inside $stage so paths are relative)
          Push-Location $stage
          $lines = @()
          foreach ($f in (Get-ChildItem -File | Where-Object { $_.Extension -in '.exe','.dll' } | Sort-Object Name)) {
            $h = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
            $lines += ("{0}  {1}" -f $h, $f.Name)
          }
          $lines | Set-Content 'SHA256SUMS.txt' -Encoding utf8
          Pop-Location
          Write-Host "Metadata + SHA256 written. Required-file check:"
          $required = @('llama-server.exe','llama-bench.exe','ggml-cuda.dll','BUILD-METADATA.json','SHA256SUMS.txt')
          $missing = @()
          foreach ($req in $required) {
            $ok = Test-Path (Join-Path $stage $req)
            Write-Host ("  {0,-20} {1}" -f $req, $(if ($ok) { 'OK' } else { 'MISSING' }))
            if (-not $ok) { $missing += $req }
          }
          if ($missing.Count -gt 0) { throw "required package files missing: $($missing -join ', ')" }
          # ZIP
          $zipPath = Join-Path $env:RUNNER_TEMP $zipName
          Compress-Archive -Path "$stage\*" -DestinationPath $zipPath -Force
          "zip_name=$zipName" >> $env:GITHUB_OUTPUT
          "zip_path=$zipPath" >> $env:GITHUB_OUTPUT
          Write-Host "Created $zipName"

      - name: Validate ZIP structure
        shell: pwsh
        run: |
          $checkDir = Join-Path $env:RUNNER_TEMP 'zipcheck'
          Expand-Archive -Path '${{ steps.meta.outputs.zip_path }}' -DestinationPath $checkDir -Force
          $must = @('llama-server.exe','llama-bench.exe','ggml-cuda.dll','ggml.dll','BUILD-METADATA.json','SHA256SUMS.txt')
          $missing = @()
          foreach ($m in $must) { if (-not (Test-Path (Join-Path $checkDir $m))) { $missing += $m } }
          if ($missing.Count -gt 0) { throw "ZIP missing required files: $($missing -join ', ')" }
          # Metadata JSON parses
          $null = Get-Content (Join-Path $checkDir 'BUILD-METADATA.json') -Raw | ConvertFrom-Json
          # Verify every recorded hash
          foreach ($line in (Get-Content (Join-Path $checkDir 'SHA256SUMS.txt'))) {
            $parts = $line -split '\s+'
            $actual = (Get-FileHash (Join-Path $checkDir $parts[1]) -Algorithm SHA256).Hash.ToLower()
            if ($actual -ne $parts[0]) { throw "hash mismatch for $($parts[1]): $actual != $($parts[0])" }
          }
          Write-Host "ZIP validation OK: $($must -join ', ')"

      - name: Query executable version metadata
        shell: pwsh
        run: |
          $checkDir = Join-Path $env:RUNNER_TEMP 'zipcheck'
          foreach ($exe in @('llama-server.exe','llama-bench.exe')) {
            $p = Join-Path $checkDir $exe
            $v = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($p)
            Write-Host "$exe: ProductName=$($v.ProductName) ProductVersion=$($v.ProductVersion) FileVersion=$($v.FileVersion)"
          }
          Write-Host "NOTE: CUDA initialization not attempted (no GPU on runner)."

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.meta.outputs.zip_name }}
          path: ${{ steps.meta.outputs.zip_path }}
          retention-days: 14

  # Publish all successful variant ZIPs to a single GitHub Release.
  publish-release:
    if: inputs.publish_release == true && needs.build.result == 'success'
    needs: build
    runs-on: windows-2022
    steps:
      - name: Download all variant artifacts
        uses: actions/download-artifact@v6
        with:
          path: dist
          pattern: llama-win-cuda*-sm120a-*.zip
          merge-multiple: true
      - name: Create release with assets
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $date = (Get-Date).ToUniversalTime().ToString('yyyyMMdd')
          $upstreamShort = (git ls-remote https://github.com/ggml-org/llama.cpp refs/heads/master | ForEach-Object { ($_ -split '	')[0].Substring(0,10) }).Trim()
          $tag = "blackwell-build-${date}-${upstreamShort}"
          $assets = @(Get-ChildItem dist -Filter *.zip | ForEach-Object { $_.FullName })
          if ($assets.Count -eq 0) { throw "no variant ZIPs found to publish" }
          # Also attach a combined SHA256 manifest if available
          $notes = @"
          Blackwell (RTX 5090 / SM120a) native Windows x64 CUDA builds.

          Assets:
          $(($assets | ForEach-Object { '  - ' + (Split-Path $_ -Leaf) }) -join "`n")

          GPU runtime validation: NOT performed on CI. REQUIRES LOCAL RTX 5090 VALIDATION.
          Each ZIP contains BUILD-METADATA.json (source SHA, CUDA/MSVC/CMake versions, CMake args) and SHA256SUMS.txt.
          "@
          gh release delete "$tag" --yes --cleanup-tag 2>$null
          gh release create "$tag" $assets --title "Blackwell Windows builds ($date)" --notes $notes
          Write-Host "Published release $tag with $($assets.Count) assets"
