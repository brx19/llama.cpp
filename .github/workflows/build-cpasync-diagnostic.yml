name: Diagnostic cp.async Blackwell backend

on:
  push:
    branches:
      - ci/cpasync-diagnostic
    paths:
      - .github/workflows/build-cpasync-diagnostic.yml

permissions:
  contents: read

env:
  CUDA_VERSION: "13.3"
  CUDA_PKG: x64
  SOURCE_BRANCH: blackwell/cpasync
  SOURCE_SHA: 30875287102b9dfc9dff77c1a114a450e585415b

jobs:
  build-cpasync-cuda:
    name: cp.async-only ggml-cuda (sm120a)
    runs-on: windows-2022
    steps:
      - name: Checkout cp.async-only source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_BRANCH }}
          fetch-depth: 1

      - name: Verify exact source commit
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          Write-Host "actual=$actual expected=$env:SOURCE_SHA"
          if ($actual -ne $env:SOURCE_SHA) {
            throw "blackwell/cpasync moved: expected $env:SOURCE_SHA, got $actual"
          }

      - name: Install CUDA Toolkit 13.3
        uses: ./.github/actions/windows-setup-cuda
        with:
          cuda_version: ${{ env.CUDA_VERSION }}
          cuda_arch: ${{ env.CUDA_PKG }}

      - name: Install Ninja
        shell: pwsh
        run: choco install ninja -y

      - name: Build Release ggml-cuda.dll only
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          if errorlevel 1 exit /b 1
          where cl
          if errorlevel 1 exit /b 1
          where nvcc
          if errorlevel 1 exit /b 1

          if exist build-cpasync rmdir /s /q build-cpasync

          cmake -S . -B build-cpasync -G "Ninja Multi-Config" ^
            -DGGML_BACKEND_DL=ON ^
            -DGGML_NATIVE=OFF ^
            -DGGML_CPU=OFF ^
            -DGGML_CUDA=ON ^
            -DLLAMA_BUILD_BORINGSSL=ON ^
            -DCMAKE_CUDA_ARCHITECTURES=120a-real
          if errorlevel 1 exit /b 1

          set /A NINJA_JOBS=%NUMBER_OF_PROCESSORS%-1
          cmake --build build-cpasync --config Release -j %NINJA_JOBS% --target ggml-cuda
          if errorlevel 1 exit /b 1

          if not exist build-cpasync\bin\Release\ggml-cuda.dll exit /b 1

      - name: Record provenance
        shell: pwsh
        run: |
          $out = 'build-cpasync/bin/Release/BUILD-CPASYNC.txt'
          @(
            'variant=cpasync-only',
            "source_sha=$env:SOURCE_SHA",
            'tma_commit_excluded=00cef0cb0b82dc018b65843b534637588b8a8179',
            'cuda=13.3',
            'cmake_cuda_architectures=120a-real',
            'configuration=Release',
            'purpose=diagnostic A/B against TMA crash at pp512'
          ) | Set-Content $out -Encoding utf8
          Get-FileHash 'build-cpasync/bin/Release/ggml-cuda.dll' -Algorithm SHA256 | Format-List

      - name: Upload cp.async-only backend
        uses: actions/upload-artifact@v4
        with:
          name: ggml-cuda-cpasync-308752871-sm120a
          path: |
            build-cpasync/bin/Release/ggml-cuda.dll
            build-cpasync/bin/Release/BUILD-CPASYNC.txt
          retention-days: 14
